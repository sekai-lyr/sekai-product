<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff7fc">
  <title>Sekai 回忆录</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">SEKAI MEMORY BOOK</p>
        <h1 id="page-title">我的回忆录</h1>
      </div>
      <button class="icon-btn" id="search-button" aria-label="搜索">⌕</button>
    </header>

    <main id="content">
      <section class="view active" data-view="home">
        <article class="hero">
          <div class="hero-copy">
            <span class="soft-pill">完全离线 · 仅保存在本机</span>
            <h2>把喜欢的世界，<br>安静地收进书架</h2>
            <p>记录每一次相遇，也记住当时被治愈的心情。</p>
          </div>
          <div class="hero-orb">✦</div>
        </article>
        <div class="stats" id="stats"></div>
        <div class="section-title"><h2>快速记录</h2></div>
        <div class="quick-grid">
          <button class="quick anime" data-add="anime"><span>▤</span><b>记录番剧</b><small>评分与观后感</small></button>
          <button class="quick character" data-add="character"><span>♡</span><b>收藏角色</b><small>喜欢的理由</small></button>
          <button class="quick quote" data-add="quote"><span>“</span><b>摘录台词</b><small>留住心动瞬间</small></button>
        </div>
        <div class="section-title"><h2>最近更新</h2><button data-nav="anime">查看全部</button></div>
        <div id="recent-list" class="stack"></div>
      </section>

      <section class="view" data-view="anime">
        <div class="toolbar">
          <div class="segmented" id="anime-filter">
            <button class="active" data-filter="全部">全部</button><button data-filter="在看">在看</button><button data-filter="已看完">已看完</button><button data-filter="想看">想看</button>
          </div>
          <button class="primary compact" data-add="anime">＋ 添加</button>
        </div>
        <div id="anime-list" class="stack"></div>
      </section>

      <section class="view" data-view="character">
        <button class="primary full" data-add="character">＋ 收藏新角色</button>
        <div id="character-list" class="character-grid"></div>
      </section>

      <section class="view" data-view="quote">
        <button class="primary full" data-add="quote">＋ 摘录新台词</button>
        <div id="quote-list" class="stack"></div>
      </section>

      <section class="view" data-view="more">
        <article class="profile-card"><div class="avatar">旅</div><div><h2>我的离线档案</h2><p>数据只保存在此设备</p></div></article>
        <div class="settings-card">
          <button id="export-button"><span>⇩</span><div><b>导出备份</b><small>将全部记录保存为 JSON 文件</small></div><i>›</i></button>
          <button id="import-button"><span>⇧</span><div><b>恢复备份</b><small>从 JSON 文件恢复记录</small></div><i>›</i></button>
          <button id="clear-button" class="danger-row"><span>⌫</span><div><b>清空全部数据</b><small>此操作无法撤销</small></div><i>›</i></button>
          <input id="import-file" type="file" accept="application/json" hidden>
        </div>
        <p class="version">Sekai Memory Book · Offline 1.0.0</p>
      </section>

      <section class="view" data-view="search">
        <div class="search-box"><span>⌕</span><input id="search-input" placeholder="搜索番剧、角色或台词" autocomplete="off"><button id="search-close">取消</button></div>
        <div id="search-results" class="stack"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" data-nav="home"><span>⌂</span><b>首页</b></button>
      <button data-nav="anime"><span>▤</span><b>番剧</b></button>
      <button data-nav="character"><span>♡</span><b>角色</b></button>
      <button data-nav="quote"><span>“</span><b>台词</b></button>
      <button data-nav="more"><span>•••</span><b>更多</b></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <header><div><p class="eyebrow">OFFLINE RECORD</p><h2 id="sheet-title">新增记录</h2></div><button id="sheet-close" class="icon-btn">×</button></header>
      <form id="record-form"><div id="form-fields"></div><div class="form-actions"><button type="button" id="delete-button" class="danger" hidden>删除</button><button type="submit" class="primary">保存记录</button></div></form>
    </section>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
