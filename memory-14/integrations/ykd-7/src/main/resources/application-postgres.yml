spring:
  datasource:
    url: ${POSTGRES_URL:${postgres.url:jdbc:postgresql://localhost:5432/openclaw}}
    username: ${POSTGRES_USERNAME:${postgres.username:openclaw}}
    password: ${POSTGRES_PASSWORD:${postgres.password:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

