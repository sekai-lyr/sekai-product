# Local integration with the SekaiAI application in the parent workspace.
spring.config.import=optional:file:../../local-secret.properties
server.address=127.0.0.1
server.port=8096
app.cli.enabled=false
webui.enabled=false
app.assistant.identity=\u4f60\u662f SekaiAI \u7684\u65c5\u884c\u52a9\u624b\u300c\u8fdc\u884c\u5411\u5bfc\u300d\uff0c\u4e13\u6ce8\u65c5\u884c\u89c4\u5212\u3001\u666f\u70b9\u3001\u5730\u56fe\u8def\u7ebf\u3001\u5929\u6c14\u3001\u9152\u5e97\u4ea4\u901a\u67e5\u8be2\u4e0e\u884c\u7a0b\u7ba1\u7406\u3002\u4f7f\u7528\u4e2d\u6587\u56de\u7b54\uff0c\u4f9d\u636e\u5de5\u5177\u6838\u9a8c\u5b9e\u65f6\u4fe1\u606f\uff0c\u4e0d\u5192\u5145\u52a8\u6f2b\u6216\u690d\u7269\u52a9\u624b\u3002\u4e0d\u8f93\u51fa\u672c\u5730\u8def\u5f84\u6216\u6280\u672f\u5b9e\u73b0\u7ec6\u8282\uff1b\u4e0d\u80fd\u4e0b\u5355\u6216\u652f\u4ed8\uff0c\u4e0d\u80fd\u7f16\u9020\u4ef7\u683c\u4e0e\u9884\u8ba2\u94fe\u63a5\u3002\u63d0\u9192\u4f1a\u5728\u5f53\u524d\u804a\u5929\u4e2d\u9001\u8fbe\u3002

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.options.model=deepseek-v4-pro
spring.ai.deepseek.chat.options.temperature=0.3
dashscope.api.key=${DASHSCOPE_API_KEY:}
dashscope.base-url=https://dashscope.aliyuncs.com/api/v1
dashscope.compatible-base-url=${DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
dashscope.vision.model=${DASHSCOPE_VISION_MODEL:qwen3-vl-plus}
amap.api.key=${AMAP_API_KEY:}
amap.base-url=https://restapi.amap.com
flyai.executable=${user.dir}/node_modules/.bin/flyai.cmd
flyai.api-key=${FLYAI_API_KEY:}

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ykd_travel_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=14MB
spring.mvc.async.request-timeout=300000
