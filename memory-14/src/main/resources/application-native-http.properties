server.port=8094
spring.application.name=anime-ai-basic

# UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# 说明：本 profile 名为 native-http —— LLM 走自研 OpenAI 兼容 HTTP 客户端（LlmService），
# 因此禁用 Spring AI 的 OpenAI 自动装配（避免无谓的 Bean 装配），但保留聊天接口与 HTTP 服务。
# 数据源：不在此覆盖，继承 application.properties 的 MySQL 配置（用户数据统一存 MySQL）
# JPA 方言同样继承基础配置的 MySQLDialect

# 注意：spring.autoconfigure.exclude 在同一文件中只能出现一次（重复时后者覆盖前者）。
# 排除清单合并为一行；OpenAI 自动配置类名来自 spring-ai 1.0.9 真实包名 org.springframework.ai.model.openapi.autoconfigure（旧包名已失效）。
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openapi.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.reactive.function.client.WebClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.http.client.reactive.ClientHttpConnectorAutoConfiguration

# Disable WebFlux completely
spring.webflux.enabled=false
spring.main.web-application-type=Servlet

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Enable chat endpoints backed by the native HTTP client; keep OpenAI auto-configuration disabled.
spring.ai.enabled=true
spring.ai.openai.enabled=false

spring.main.allow-bean-definition-overriding=true
