spring.application.name=anime-ai
server.port=8094

# UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# SQLite
spring.datasource.url=jdbc:sqlite:data/anime_ai.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=single
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.format_sql=true

# Disable all AI-related features to avoid Netty issues
spring.ai.openai.enabled=false
spring.ai.openai.api-key=
spring.ai.openai.base-url=

# Disable WebFlux completely
spring.webflux.enabled=false
spring.main.web-application-type=Servlet

# Disable Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable reactive web client
spring.http.client.reactive.enabled=false

spring.main.allow-bean-definition-overriding=true

spring.web.resources.static-locations=classpath:/static/

# Anime LLM (disabled for now)
anime.llm.api-key=
anime.llm.base-url=
anime.llm.model=
