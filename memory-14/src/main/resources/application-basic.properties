server.port=8094
spring.application.name=anime-ai-basic
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
spring.main.web-application-type=Servlet
spring.web.resources.static-locations=classpath:/static/
spring.main.allow-bean-definition-overriding=true
# Disable all auto-configuration to avoid network issues
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.client.RestTemplateAutoConfiguration,org.springframework.boot.autoconfigure.web.reactive.function.client.WebClientAutoConfiguration,org.springframework.boot.autoconfigure.http.HttpMessageConvertersAutoConfiguration
