<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061321">
  <title>FANCE · Welcome back</title>
  <link rel="stylesheet" href="/css/fance-auth.css">
</head>
<body>
  <div class="auth-page" data-page="login">
    <div class="scene" aria-hidden="true">
      <img class="scene-backdrop" src="/assets/fance-retreat-video.jpg" alt="" fetchpriority="high">
      <div class="scene-water-glow"></div>
      <div class="scene-overlay"></div>
      <div class="scene-shimmer"></div>
      <div class="scene-stars"></div>
      <span class="shooting-star star-one"></span>
      <span class="shooting-star star-two"></span>
      <span class="shooting-star star-three"></span>
      <span class="shooting-star star-four"></span>
      <span class="shooting-star star-five"></span>
      <span class="shooting-star star-six"></span>
      <span class="shooting-star star-seven"></span>
      <span class="shooting-star star-eight"></span>
      <span class="shooting-star star-nine"></span>
      <span class="shooting-star star-ten"></span>
      <div class="grain"></div>
    </div>

    <header class="auth-header">
      <a class="wordmark" href="/" aria-label="FANCE home">
        <span class="wordmark-mark" aria-hidden="true"></span>
        <span class="wordmark-name">FANCE</span>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="siteNav">Menu</button>
      <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/#about">About</a>
        <a href="/#journal">Journal</a>
        <a href="mailto:hello@fance.stay">Contact</a>
      </nav>
    </header>

    <main class="auth-content">
      <section class="experience-copy" aria-labelledby="hero-title">
        <h1 id="hero-title">
          <span>A Quiet Escape,</span>
          <span>Beautifully Designed</span>
        </h1>
        <button class="explore-link" type="button" aria-controls="accessLayer" aria-expanded="false">Explore the Space</button>
      </section>
    </main>

    <div class="access-layer" id="accessLayer" hidden>
      <div class="access-backdrop" data-close-access="true"></div>
      <section class="auth-card" id="access" role="dialog" aria-modal="true" aria-labelledby="access-title" aria-hidden="true">
        <button class="access-close" type="button" aria-label="Close account access">Close</button>
        <div class="card-head">
          <span class="card-kicker">Private access</span>
          <h2 id="access-title">Welcome back</h2>
          <p>Continue to your quiet corner of FANCE.</p>
        </div>

        <nav class="auth-switch" aria-label="Account access">
          <a class="active" href="/login" aria-current="page">Sign in</a>
          <a href="/register">Create account</a>
        </nav>

        <div class="form-message" id="serverMsg" role="alert" aria-live="polite" hidden></div>

        <form class="auth-form" id="loginForm">
          <label class="field" for="userName">
            <span class="field-label">Username</span>
            <input id="userName" name="userName" type="text" autocomplete="username" placeholder="Enter your username" required>
          </label>

          <label class="field" for="pw">
            <span class="field-label">Password</span>
            <span class="password-wrap">
              <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <span class="eye-icon" aria-hidden="true"></span>
              </button>
            </span>
          </label>

          <button class="submit-button" type="submit">Enter FANCE</button>
        </form>

        <p class="form-legal">A slower pace begins here.</p>
      </section>
    </div>

    <div class="pool-ripples" aria-hidden="true"></div>
    <span class="sky-sprite" aria-hidden="true"></span>
    <button class="access-fab" type="button" aria-controls="accessLayer" aria-expanded="false" aria-label="Open account access">
      <span aria-hidden="true"></span>
    </button>
  </div>

  <script src="/js/fance-auth.js"></script>
</body>
</html>
