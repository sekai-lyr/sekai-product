server.port=8094
spring.application.name=anime-ai-basic

# UTF-8 encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# SQLite
spring.datasource.url=jdbc:sqlite:data/anime_ai_basic.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Disable ALL Spring AI auto-configuration
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.boot.autoconfigure.web.reactive.function.client.WebClientAutoConfiguration,org.springframework.boot.autoconfigure.http.client.reactive.ClientHttpConnectorAutoConfiguration

# Disable WebFlux completely
spring.webflux.enabled=false
spring.main.web-application-type=Servlet

# Disable Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Disable all AI-related features
spring.ai.enabled=false
spring.ai.openai.enabled=false
spring.ai.openai.api-key=
spring.ai.openai.base-url=

# Disable reactive web client
spring.http.client.reactive.enabled=false

spring.main.allow-bean-definition-overriding=true
# Disable problematic network features
spring.main.allow-bean-definition-overriding=true
