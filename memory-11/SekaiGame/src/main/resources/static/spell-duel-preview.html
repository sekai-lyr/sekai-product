<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>决斗实机魔法演出</title><link rel="stylesheet" href="css/style.css?v=2.3.0-echo"><link rel="stylesheet" href="css/anime-theme.css?v=1.2.0-responsive-duel"><style>
body{margin:0;background:#050710}.preview-tools{position:fixed;z-index:320;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid #76cad866;border-radius:10px;background:#07111aeb;backdrop-filter:blur(12px)}.preview-tools select,.preview-tools button{border:1px solid #7eb9c4;border-radius:6px;background:#102638;color:#fff;padding:9px 12px}.preview-tools select{width:min(330px,46vw)}.preview-tools button{font-weight:800}.preview-hud{position:absolute;z-index:7;padding:8px 13px;border:1px solid #73baca66;background:#07121de6;color:#dff9ff}.preview-hud strong{display:block}.preview-hud small{color:#7ed7e5}.preview-hud.opp{top:70px;left:20px}.preview-hud.me{bottom:182px;right:20px}.field-slot.demo-slot{display:grid;place-items:center;overflow:hidden}.field-slot.demo-slot img{width:100%;height:100%;object-fit:cover}.field-slot.demo-slot::after{content:attr(data-label);position:absolute;inset:auto 0 0;padding:14px 3px 4px;background:linear-gradient(transparent,#030712e8);font-size:8px;text-align:center;color:#fff}.hand .demo-hand-card{width:70px;aspect-ratio:5/7;border:1px solid #78c9d9;border-radius:5px;overflow:hidden}.demo-hand-card img{width:100%;height:100%;object-fit:cover}@media(max-width:700px){.preview-tools{bottom:7px;width:94vw}.preview-tools select{min-width:0;flex:1}.preview-hud.me{bottom:150px}}
</style></head><body id="sekai-game"><section class="battle-screen active" id="battle-screen" data-duel-scene="neon-rooftop"><div class="duel-backdrop"></div><div class="battlefield-center-glow"></div><div class="duel-particles"></div><header class="duel-header"><button class="duel-header-btn">退出决斗</button><div class="duel-title"><span>VFX LIVE MATCH</span><strong>次元决斗 · 实机演出</strong></div><button class="duel-header-btn">战斗日志</button></header><div class="preview-hud opp"><small>OPPONENT</small><strong>测试对手　LP 8000</strong></div><div class="preview-hud me"><small>DUELIST</small><strong>玩家　LP 8000</strong></div><div class="deck-pile deck-pile-opponent"><div class="deck-card-back"><span>NC</span></div><strong>31</strong><small>DECK</small></div><div class="graveyard-pile graveyard-pile-opponent"><div class="graveyard-card-back"><span>GY</span></div><strong>2</strong><small>GY</small></div><section class="battlefield" id="battlefield"><div class="field-half opp-half"><div class="spell-trap-row" id="opp-spells"></div><div class="monster-row" id="opp-monsters"></div><div class="battle-preview-host"></div></div><div class="field-zone-center"><div class="field-zone-slot"></div><div class="field-zone-slot"></div></div><div class="field-half my-half"><div class="monster-row" id="my-monsters"></div><div class="spell-trap-row" id="my-spells"></div></div></section><div class="deck-pile deck-pile-player"><div class="deck-card-back"><span>NC</span></div><strong>28</strong><small>DECK</small></div><div class="graveyard-pile graveyard-pile-player"><div class="graveyard-card-back"><span>GY</span></div><strong>4</strong><small>GY</small></div><div class="center-controls"><div class="turn-badge">主要阶段 1</div><button class="ctrl-btn btn-end">结束回合</button></div><div class="hand-tray"><div class="hand-tray-label"><span>YOUR HAND</span><strong>5</strong></div><section class="hand" id="hand"></section></div></section><div class="preview-tools"><select id="cards"></select><button id="play">发动魔法</button></div><script type="module">
import{playCardPerformance}from'./js/card-performance-fx.js?v=20';import{getCardPerformance}from'./js/card-performance.js?v=20';import{getAuthoredScene}from'./js/authored-card-scenes.js?v=20';import{animatePlayToZone}from'./js/effects.js?v=20';const select=document.querySelector('#cards'),button=document.querySelector('#play');let cards=[],card,source,target,playing=false;const slot=(c,label)=>`<div class="field-slot has-card demo-slot" data-label="${label}"><img src="${getCardPerformance(c).image}" alt="${c.name}"></div>`,empty=()=>'<div class="field-slot empty demo-slot"></div>',cardHtml=c=>`<div class="card in-field"><div class="card-frame"><div class="card-art"><img src="${getCardPerformance(c).image}" alt="${c.name}"></div></div></div>`;
async function load(){const all=await(await fetch('/api/cards')).json();cards=all.filter(c=>c.type==='spell'&&getAuthoredScene(c.id,'spell')).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));const victim=all.find(c=>c.id==='ygo_n_89631139')||all.find(c=>c.type==='monster');select.innerHTML=cards.map(c=>`<option value="${c.id}">${c.rarity}｜${c.name}</option>`).join('');document.querySelector('#opp-monsters').innerHTML=slot(victim,victim.name)+`<div class="field-slot empty"></div><div class="field-slot empty"></div>`;document.querySelector('#my-monsters').innerHTML=`<div class="field-slot empty"></div><div class="field-slot empty"></div><div class="field-slot empty"></div>`;document.querySelector('#opp-spells').innerHTML=`<div class="field-slot empty"></div><div class="field-slot empty"></div><div class="field-slot empty"></div>`;choose(new URLSearchParams(location.search).get('id')||'gallery_spell_014');setTimeout(play,450)}
function choose(id){card=cards.find(c=>c.id===id)||cards[0];select.value=card.id;document.querySelector('#my-spells').innerHTML=empty()+empty()+empty();target=document.querySelector('#opp-monsters .has-card');const hand=document.querySelector('#hand');const others=cards.filter(c=>c!==card).slice(0,4);hand.innerHTML=[card,...others].map((c,i)=>`<div class="demo-hand-card"${i===0?' id="active-hand-card"':''}><img src="${getCardPerformance(c).image}" alt="${c.name}"></div>`).join('');history.replaceState(null,'',`?id=${card.id}&rev=20`)}
async function play(){if(!card||playing)return;playing=true;button.textContent='演出中…';try{const hand=document.querySelector('#active-hand-card'),destination=document.querySelector('#my-spells .field-slot');await animatePlayToZone(card,hand,destination,cardHtml,{endScale:.75});destination.outerHTML=slot(card,card.name);source=document.querySelector('#my-spells .has-card');await new Promise(r=>setTimeout(r,180));await playCardPerformance(card,'spell',source,target)}finally{playing=false;button.textContent='再次发动'}}select.onchange=()=>{choose(select.value);setTimeout(play,120)};button.onclick=()=>{choose(card.id);setTimeout(play,80)};load();
</script></body></html>
