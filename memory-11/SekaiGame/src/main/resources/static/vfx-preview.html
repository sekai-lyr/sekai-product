<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全角色卡全屏特效演示</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#17273d,#070b13 58%,#020409);color:#fff;font-family:"Microsoft YaHei",sans-serif}.stage{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(14px,3vw,34px)}header{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:clamp(19px,3vw,34px);letter-spacing:.12em}.meta{color:#91d9ef;font:11px/1.5 monospace;letter-spacing:.13em}.picker{display:flex;gap:8px}.picker input,.picker select{border:1px solid #6dbbd0;background:#0b1524;color:#eefbff;border-radius:8px;padding:9px 10px;max-width:250px}.arena{position:relative;display:flex;align-items:center;justify-content:space-around;gap:min(24vw,320px)}.card{position:relative;width:clamp(94px,12vw,156px);aspect-ratio:5/7;border:1px solid #83dff5;border-radius:8px;background:#111827;box-shadow:0 0 30px #4fdfff44;overflow:hidden;z-index:2}.card img{width:100%;height:100%;object-fit:cover}.card span{position:absolute;inset:auto 0 0;padding:24px 8px 8px;background:linear-gradient(transparent,#050912ee);font-weight:700;font-size:11px;text-align:center}.target{border-color:#ff8e9e;box-shadow:0 0 30px #ff4f7044}.controls{display:flex;justify-content:center;gap:8px;z-index:300;flex-wrap:wrap}.controls button{border:1px solid #68cee7;background:#0d1b2c;color:#e9fbff;padding:11px 18px;border-radius:999px;font-weight:700;cursor:pointer}.controls button:hover,.controls button.active{background:#167d9b}.hint{text-align:center;color:#7f93aa;font-size:11px;margin-top:9px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.picker{width:100%}.picker input{width:42%}.picker select{width:58%}.arena{gap:22vw}.card{width:96px}.controls button{padding:10px 13px}}
</style></head><body><main class="stage"><header><div><h1 id="name">全角色卡演出验收</h1><div class="meta" id="meta">LOADING VFX DATABASE</div></div><div class="picker"><input id="search" placeholder="搜索角色或编号"><select id="cards"></select></div></header><section class="arena"><div class="card" id="source"><img alt="角色卡图"><span>角色卡</span></div><div class="card target" id="target"><span>命中目标</span></div></section><footer><div class="controls"><button data-phase="summon">全屏登场</button><button data-phase="attack">全屏攻击</button><button data-phase="destroy">全屏破坏</button><button id="sequence">连续播放</button><button id="prev">上一张</button><button id="next">下一张</button></div><div class="hint">← → 切卡，空格连续播放 · 自动适配手机和桌面</div></footer></main><script type="module">
import{playCardPerformance}from'./js/card-performance-fx.js?v=12';import{getCardPerformance}from'./js/card-performance.js?v=10';import{getAuthoredScene}from'./js/authored-card-scenes.js?v=16';const q=s=>document.querySelector(s),select=q('#cards'),search=q('#search'),source=q('#source'),target=q('#target');let cards=[],filtered=[],selected,playing=false;const normalize=d=>(Array.isArray(d)?d:Object.values(d||{}).filter(v=>v&&v.id)).filter(c=>c.type==='monster'&&/^picture_(ex|ssr7)_/.test(c.id)&&getAuthoredScene(c.id,'summon'));async function load(){const r=await fetch('/api/cards'),d=await r.json();cards=normalize(d).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));filter();const id=new URLSearchParams(location.search).get('id');choose(Math.max(0,cards.findIndex(c=>c.id===id)))}function filter(){const k=search.value.trim().toLowerCase();filtered=cards.filter(c=>!k||`${c.id} ${c.name}`.toLowerCase().includes(k));select.innerHTML=filtered.map(c=>`<option value="${c.id}">${c.id}｜${c.name}</option>`).join('')}function choose(i){if(!cards.length)return;selected=cards[(i+cards.length)%cards.length];select.value=selected.id;if(!select.value){search.value='';filter();select.value=selected.id}const p=getCardPerformance(selected);q('#name').textContent=selected.name;q('#meta').textContent=`${selected.id} · ${selected.rarity||'—'} · FULLSCREEN CINEMATIC`;source.querySelector('img').src=p.image;source.querySelector('span').textContent=getAuthoredScene(selected.id,'attack')?.title||selected.name;history.replaceState(null,'',`?id=${selected.id}&rev=16`)}async function play(phase){if(!selected||playing)return;playing=true;try{await playCardPerformance(selected,phase,source,phase==='attack'?target:source)}finally{playing=false}}async function seq(){for(const p of['summon','attack','destroy']){await play(p);await new Promise(r=>setTimeout(r,220))}}function move(d){choose(cards.indexOf(selected)+d)}search.oninput=filter;select.onchange=()=>choose(cards.findIndex(c=>c.id===select.value));q('#prev').onclick=()=>move(-1);q('#next').onclick=()=>move(1);q('#sequence').onclick=seq;document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>play(b.dataset.phase));addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space'){e.preventDefault();seq()}});load().then(()=>setTimeout(seq,350)).catch(e=>q('#meta').textContent=`加载失败 · ${e.message}`);
</script></body></html>
