<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>炭治郎动画验收</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#29110d 0,#090b13 48%,#030509 100%);color:#fff;font-family:"Microsoft YaHei",sans-serif}.stage{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,4vw,48px)}header{text-align:center;z-index:2}h1{margin:0;font-size:clamp(22px,4vw,42px);letter-spacing:.15em}header p{margin:9px 0;color:#e2a868;font-size:12px;letter-spacing:.24em}.arena{position:relative;display:flex;align-items:center;justify-content:space-around;gap:16vw}.card{position:relative;width:clamp(92px,13vw,156px);aspect-ratio:5/7;border:1px solid #ffc66a;border-radius:8px;background:#1b1614;box-shadow:0 0 28px #ff6a3055;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}.card span{position:absolute;inset:auto 0 0;padding:20px 8px 7px;background:linear-gradient(transparent,#09090ddd);font-weight:700;font-size:11px;text-align:center}.target{border-color:#73d7ff;box-shadow:0 0 28px #55caff44}.controls{display:flex;justify-content:center;gap:10px;z-index:300;flex-wrap:wrap}.controls button{border:1px solid #ffbb64;background:#211410;color:#ffe8c7;padding:12px 20px;border-radius:999px;font-weight:700;cursor:pointer}.controls button:hover,.controls button.active{background:#c84422;color:#fff}.hint{text-align:center;color:#98a6b8;font-size:11px;margin-top:12px}@media(max-width:600px){.arena{gap:22vw}.card{width:100px}.controls button{padding:11px 15px}}
</style>
</head>
<body><main class="stage"><header><h1 id="character-name">灶门炭治郎</h1><p id="character-subtitle">HINOKAMI KAGURA · CINEMATIC REVIEW</p><p><a href="?card=tanjiro&rev=5" style="color:#ffb65c">炭治郎</a>　<a href="?card=nezuko&rev=5" style="color:#ff6f9d">祢豆子</a>　<a href="?card=zenitsu&rev=5" style="color:#ffe45b">善逸</a></p></header><section class="arena"><div class="card" id="source"><img alt="角色卡图"><span>火之神神乐</span></div><div class="card target" id="target"><span>命中目标</span></div></section><footer><div class="controls"><button data-phase="summon">登场动画</button><button data-phase="attack">攻击动画</button><button data-phase="destroy">破坏动画</button><button id="sequence">连续播放</button></div><div class="hint">点击任一按钮重复播放 · 桌面与手机使用不同镜头比例</div></footer></main>
<script type="module">
import {playCardPerformance} from './js/card-performance-fx.js?v=12';
import {getCardPerformance} from './js/card-performance.js?v=10';
const key=new URLSearchParams(location.search).get('card')||'tanjiro',cards={tanjiro:{id:'picture_ex_019',name:'灶门炭治郎',label:'火之神神乐',subtitle:'HINOKAMI KAGURA'},nezuko:{id:'picture_ex_027',name:'灶门祢豆子',label:'血鬼术·爆血',subtitle:'EXPLODING BLOOD'},zenitsu:{id:'picture_ex_021',name:'我妻善逸',label:'雷之呼吸·霹雳一闪',subtitle:'THUNDERCLAP AND FLASH'},inosuke:{id:'picture_ex_029',name:'嘴平伊之助',label:'兽之呼吸·乱裂',subtitle:'BEAST BREATHING'},giyu:{id:'picture_ex_025',name:'富冈义勇',label:'水之呼吸·水车',subtitle:'WATER BREATHING'},rengoku:{id:'picture_ex_030',name:'炼狱杏寿郎',label:'炎之呼吸·炎虎',subtitle:'FLAME BREATHING'},shinobu:{id:'picture_ex_024',name:'蝴蝶忍',label:'虫之呼吸·蝶之舞',subtitle:'INSECT BREATHING'},sanemi:{id:'picture_ex_058',name:'不死川实弥',label:'风之呼吸·黑风烟岚',subtitle:'WIND BREATHING'},muichiro:{id:'picture_ex_049',name:'时透无一郎',label:'霞之呼吸·胧',subtitle:'MIST BREATHING'},mitsuri:{id:'picture_ex_045',name:'甘露寺蜜璃',label:'恋之呼吸·猫足恋风',subtitle:'LOVE BREATHING'}},selected=cards[key]||cards.tanjiro,card={id:selected.id},source=document.querySelector('#source'),target=document.querySelector('#target');
document.querySelector('#character-name').textContent=selected.name;document.querySelector('#character-subtitle').textContent=`${selected.subtitle} · CINEMATIC REVIEW`;document.querySelector('#source span').textContent=selected.label;
document.querySelector('header p:last-child').insertAdjacentHTML('beforeend','　<a href="?card=inosuke&rev=8" style="color:#bdeeff">伊之助</a>　<a href="?card=giyu&rev=8" style="color:#70d7ff">义勇</a>　<a href="?card=rengoku&rev=8" style="color:#ff9a45">炼狱</a>　<a href="?card=shinobu&rev=8" style="color:#d9a7ff">蝴蝶忍</a>　<a href="?card=sanemi&rev=8" style="color:#a8f1c4">实弥</a>　<a href="?card=muichiro&rev=8" style="color:#bfeeff">无一郎</a>　<a href="?card=mitsuri&rev=8" style="color:#ff78b6">蜜璃</a>');
const profile=getCardPerformance(card); document.querySelector('#source img').src=profile.image;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function play(phase){document.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.phase===phase));await playCardPerformance(card,phase,source,phase==='attack'?target:source);document.querySelectorAll('button').forEach(button=>button.classList.remove('active'));}
document.querySelectorAll('[data-phase]').forEach(button=>button.addEventListener('click',()=>play(button.dataset.phase)));
document.querySelector('#sequence').addEventListener('click',async()=>{for(const phase of ['summon','attack','destroy']){await play(phase);await wait(280);}});
setTimeout(()=>document.querySelector('#sequence').click(),500);
</script></body></html>
