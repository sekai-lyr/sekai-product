<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法卡全屏特效演示</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16122b,#03040a 68%);color:#fff;font-family:"Microsoft YaHei",sans-serif}.stage{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(16px,3vw,34px)}header{z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:18px}h1{margin:0;font-size:clamp(20px,3vw,36px);letter-spacing:.16em}.eyebrow{color:#cdb7ff;font:11px monospace;letter-spacing:.22em;margin-bottom:8px}select{min-width:210px;border:1px solid #9d85dc;border-radius:9px;padding:10px 12px;background:#120d22;color:#fff}.arena{display:flex;align-items:center;justify-content:center;gap:clamp(70px,22vw,340px)}.card{position:relative;width:clamp(105px,13vw,168px);aspect-ratio:5/7;border-radius:9px;border:1px solid #b9a0ff;background:#0b0914;box-shadow:0 0 28px #8e65ff55;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}.victim{border-color:#ff8797;box-shadow:0 0 28px #ff496455}.tag{position:absolute;inset:auto 0 0;padding:24px 8px 8px;background:linear-gradient(transparent,#05030dee);font-size:11px;text-align:center}.controls{text-align:center;z-index:300}.controls button{border:1px solid #cab6ff;border-radius:999px;padding:12px 28px;background:#33245d;color:#fff;font-weight:800;letter-spacing:.12em;cursor:pointer}.controls button:hover{background:#583c9b}.hint{margin-top:9px;color:#978eae;font-size:11px}@media(max-width:640px){header{display:block}select{margin-top:12px;width:100%}.arena{gap:24vw}.card{width:104px}}
</style></head><body><main class="stage"><header><div><div class="eyebrow">FULLSCREEN SPELL CINEMATIC · 105 / 105</div><h1 id="title">魔法卡演出</h1></div><select id="cards"></select></header><section class="arena"><div class="card" id="spell"><img alt="魔法卡"><span class="tag">发动魔法</span></div><div class="card victim" id="target"><span class="tag">效果目标</span></div></section><footer class="controls"><button id="play">发动魔法</button><div class="hint">105 张魔法卡均可切换 · 点击发动或按空格重播</div></footer></main><script type="module">
import{playCardPerformance}from'./js/card-performance-fx.js?v=19';import{getCardPerformance}from'./js/card-performance.js?v=17';import{getAuthoredScene}from'./js/authored-card-scenes.js?v=19';
const source=document.querySelector('#spell'),target=document.querySelector('#target'),button=document.querySelector('#play'),select=document.querySelector('#cards');let cards=[],card,playing=false;
async function load(){const data=await(await fetch('/api/cards')).json();cards=data.filter(c=>c.type==='spell'&&getAuthoredScene(c.id,'spell')).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));select.innerHTML=cards.map(c=>`<option value="${c.id}">${c.rarity}｜${c.name}</option>`).join('');choose(new URLSearchParams(location.search).get('id')||cards[0].id);setTimeout(play,350)}
function choose(id){card=cards.find(c=>c.id===id)||cards[0];select.value=card.id;document.querySelector('#title').textContent=`魔法「${card.name}」`;source.querySelector('img').src=getCardPerformance(card).image;source.querySelector('.tag').textContent=card.name;history.replaceState(null,'',`?id=${card.id}&rev=20`)}
async function play(){if(!card||playing)return;playing=true;button.textContent='演出播放中…';try{await playCardPerformance(card,'spell',source,target)}finally{playing=false;button.textContent=`再次发动「${card.name}」`}}
select.onchange=()=>{choose(select.value);setTimeout(play,100)};button.onclick=play;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play()}});load();
</script></body></html>
