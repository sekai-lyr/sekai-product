spring:
  application:
    name: sekai-world-engine
  datasource:
    url: ${SEKAI_DB_URL:jdbc:mysql://localhost:3306/sekai_world?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SEKAI_DB_USERNAME:sekai}
    password: ${SEKAI_DB_PASSWORD:20070831}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SEKAI_SERVER_PORT:8095}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

sekai:
  auth:
    token-secret: ${SEKAI_TOKEN_SECRET:change-me-in-production-please-use-a-long-random-secret}
    token-ttl-hours: ${SEKAI_TOKEN_TTL_HOURS:24}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:sekai;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
