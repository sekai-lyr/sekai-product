<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Live2D Test v5</title>
<style>
body{background:#1a1a2e;color:#fff;font-family:monospace;margin:20px}
#log{white-space:pre-wrap;margin:10px 0;font-size:12px;max-height:80vh;overflow-y:auto}
canvas{border:2px solid #44ccaa;display:block}
.ok{color:#4f8} .fail{color:#f44} .info{color:#8af}
</style>
</head>
<body>
<h2>Live2D Diagnostic v5 (stub + error capture)</h2>
<div id="log"></div>
<canvas id="c" width="800" height="600"></canvas>

<script src="/js/pixi.min.js"></script>
<script src="/js/live2dcubismcore.min.js"></script>

<script>
var logEl = document.getElementById('log');
function L(msg, cls) {
    logEl.innerHTML += (cls ? '<span class="'+cls+'">'+msg+'</span>' : msg) + '\n';
}

// Capture errors
window._errors = [];
window.addEventListener('error', function(e) {
    window._errors.push(e.message);
    L('ERROR: ' + e.message, 'fail');
});

L('Stubbing Live2D...', 'info');
window.Live2D = {
    init: function(){},
    getError: function(){ return null; },
    setError: function(){},
    ModelWebGL: { loadModel: function(){ throw new Error('C2'); } },
    Utility: {}
};
L('Live2D stub done', 'ok');

// Also stub PIXI module system that library might need
L('PIXI keys pre: ' + Object.keys(PIXI).filter(k=>k.length<10).join(','), 'info');
</script>

<script src="/js/pixi-live2d-display.min.js"></script>

<script>
L('--- After load ---', 'info');
L('Total errors captured: ' + window._errors.length, window._errors.length ? 'fail' : 'ok');
L('PIXI.live2d keys: ' + Object.keys(PIXI.live2d).join(', '));
L('Live2DModel: ' + (typeof PIXI.live2d.Live2DModel));

if (typeof PIXI.live2d.Live2DModel !== 'undefined') {
    var app = new PIXI.Application({
        view: document.getElementById('c'),
        width: 800, height: 600,
        backgroundColor: 0x1a1a2e, antialias: true
    });
    PIXI.live2d.Live2DModel.from('/live2d-models/haru/haru.model3.json').then(function(m) {
        L('SUCCESS!', 'ok');
        m.scale.set(0.15); m.anchor.set(0.5,0.5);
        m.x=400; m.y=300; app.stage.addChild(m);
    }).catch(function(e) { L('Model fail: '+e.message, 'fail'); });
}
</script>
</body>
</html>
