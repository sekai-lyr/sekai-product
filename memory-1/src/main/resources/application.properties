spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=20070831

# 全局编码配置
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 服务端口 - 二次元数据锡通
server.port=8081

# 台词原音频上传
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# MyBatis配置
mybatis.mapper-locations=classpath*:com.sekai.dataobject.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Session timeout - 2 hours (in case of inactivity)
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M1
