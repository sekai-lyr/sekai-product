<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元数据锡通 - 登录</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
    <meta name="theme-color" content="#0b0c0e">
</head>
<body>
<!-- THESIS: 登录页先让用户记住资料中心的身份，再用一个直接的表单进入真实数据。 OWN-WORLD: 深色档案室、幽灵段码、暖橙红强调色和生成的资料氛围素材。 STORY: 认识 Sekai Data Object，输入账号，进入番剧、人物和台词关系。 FIRST VIEWPORT: 左侧是资料氛围图和产品范围，右侧是高对比登录表单。 FORM: 候选 5，七段数码显示器家族，seed 35146822。 FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<main class="login-page">
    <section class="brand-area" aria-labelledby="brand-title">
        <div class="brand-copy">
            <span class="brand-mark">SDO</span>
            <div class="brand-title">
                <h1 id="brand-title">Sekai Data Object</h1>
                <p>二次元数据锡通</p>
            </div>
        </div>
        <div class="brand-slogan">
            <p>番剧、人物、角色台词与原声音频，全部回到同一座资料库。</p>
        </div>
        <div class="brand-records" aria-label="资料库模块">
            <span>番剧档案</span>
            <span>人物图鉴</span>
            <span>台词原声</span>
        </div>
    </section>

    <section class="form-area" aria-labelledby="login-title">
        <div class="auth-topbar">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题">浅色</button>
        </div>
        <div class="login-card">
            <div class="card-header">
                <div class="header-rule"></div>
                <h2 id="login-title">欢迎回来</h2>
                <p>登录二次元数据锡通</p>
            </div>

            <div class="server-message success" th:if="${message}" th:text="${message}" role="status" aria-live="polite"></div>
            <div class="server-message error" th:if="${error}" th:text="${error}" role="alert"></div>

            <form id="loginForm" th:action="@{/user/login}" action="/user/login" method="post">
                <div class="form-group">
                    <label for="userName">用户名</label>
                    <div class="input-box">
                        <span class="input-code" aria-hidden="true">ID</span>
                        <input type="text" id="userName" name="userName" placeholder="请输入用户名" autocomplete="username" required>
                    </div>
                    <div class="error-text" id="userNameError" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-box">
                        <span class="input-code" aria-hidden="true">PW</span>
                        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                        <button class="ghost-toggle" type="button" id="togglePassword" aria-label="显示密码">显示</button>
                    </div>
                    <div class="error-text" id="passwordError" aria-live="polite"></div>
                </div>

                <div class="form-options">
                    <label class="remember-box"><input type="checkbox" id="rememberMe" name="rememberMe"><span>记住我</span></label>
                </div>

                <button type="submit" class="login-btn">登录</button>

                <div class="bottom-tip">还没有账号？ <a th:href="@{/register}" href="/register">立即注册</a></div>
            </form>
        </div>
        <footer class="auth-footer">© 2026 Sekai Data Object / 二次元数据锡通</footer>
    </section>
</main>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script th:src="@{/js/login.js}" src="/js/login.js"></script>
</body>
</html>
