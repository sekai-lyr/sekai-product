<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Anime - 注册</title>
    <link rel="stylesheet" th:href="@{/css/login.css(v=999)}" href="/css/login.css?v=999">
</head>
<body>
<!-- Particle Starfield -->
<canvas class="starfield-canvas sekai-starfield" data-count="120"></canvas>
<!-- Sakura Petals -->
<canvas class="canvas-sakura sekai-sakura" data-count="30"></canvas>
<!-- Mouse Glow Trail -->
<canvas class="canvas-glow sekai-glow"></canvas>
<!-- Floating Orbs -->
<canvas class="canvas-orbs sekai-orbs"></canvas>
<!-- Sparkle Trail -->
<canvas class="canvas-sekai-sparkles sekai-sparkles"></canvas>
<!-- Neon Shapes -->
<canvas class="canvas-sekai-neon-shapes sekai-neon-shapes"></canvas>
<!-- Click Ripple -->
<canvas class="canvas-sekai-ripple-effect sekai-ripple-effect"></canvas>

<main class="login-page">
    <div class="login-card">
        <h2>创建账号 🚀</h2>
        <p>开始整理你的动漫站点收藏</p>
        <div class="server-message error" th:if="${error}" th:text="${error}"></div>
        <form action="/user/register" method="post" id="registerForm">
            <label for="userName">用户名</label>
            <input id="userName" name="userName" type="text" placeholder="例如 sekai" autocomplete="username" required>
            <label for="nickName">昵称</label>
            <input id="nickName" name="nickName" type="text" placeholder="你的展示昵称">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required>
            <label for="confirmPassword">确认密码</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="再输入一次密码" autocomplete="new-password" required>
            <button class="primary-btn sekai-btn" type="submit">🎉 注册</button>
        </form>
        <a class="secondary-btn sekai-btn" href="/login">← 返回登录</a>
        <a class="back-link" href="/">← 返回首页</a>
    </div>
</main>

<script th:src="@{/js/register.js}" src="/js/register.js"></script>
<script th:src="@{/js/effects.js(v='20260806-sakura3')}" src="/js/effects.js?v=20260806-sakura3"></script>
</body>
</html>
