<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Anime - 登录</title>
    <link rel="stylesheet" th:href="@{/css/login.css(v=999)}" href="/css/login.css?v=999">
</head>
<body>
<!-- Particle Starfield -->
<canvas class="starfield-canvas sekai-starfield" data-count="120"></canvas>
<!-- Sakura Petals -->
<canvas class="canvas-sakura sekai-sakura" data-count="30"></canvas>
<!-- Mouse Glow Trail -->
<canvas class="canvas-glow sekai-glow"></canvas>
<!-- Floating Orbs -->
<canvas class="canvas-orbs sekai-orbs"></canvas>
<!-- Sparkle Trail -->
<canvas class="canvas-sekai-sparkles sekai-sparkles"></canvas>
<!-- Neon Shapes -->
<canvas class="canvas-sekai-neon-shapes sekai-neon-shapes"></canvas>
<!-- Click Ripple -->
<canvas class="canvas-sekai-ripple-effect sekai-ripple-effect"></canvas>

<main class="login-page">
    <div class="login-card">
        <h2>欢迎回来 👋</h2>
        <p>登录你的动漫中转站</p>
        <div class="server-message success" th:if="${message}" th:text="${message}"></div>
        <div class="server-message error" th:if="${error}" th:text="${error}"></div>
        <form action="/user/login" method="post" id="loginForm">
            <label for="userName">用户名 / 昵称</label>
            <input id="userName" name="userName" type="text" placeholder="请输入用户名" autocomplete="username" required>
            <label for="password">密码</label>
            <div class="password-row">
                <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                <button type="button" id="togglePassword">显示</button>
            </div>
            <button class="primary-btn sekai-btn" type="submit">✨ 登录</button>
        </form>
        <a class="secondary-btn sekai-btn" href="/register">📝 创建新账号</a>
        <a class="back-link" href="/">← 返回首页</a>
    </div>
</main>

<script th:src="@{/js/login.js}" src="/js/login.js"></script>
<script th:src="@{/js/effects.js(v='20260806-sakura3')}" src="/js/effects.js?v=20260806-sakura3"></script>
</body>
</html>
