<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekai Anime - 数据看板</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body style="background:var(--ink);">
<!-- Particle Starfield -->
<canvas class="starfield-canvas sekai-starfield" data-count="80"></canvas>
<!-- Sakura Petals -->
<canvas class="canvas-sakura sekai-sakura" data-count="25"></canvas>
<!-- Mouse Glow Trail -->
<canvas class="canvas-glow sekai-glow"></canvas>
<!-- Floating Orbs -->
<canvas class="canvas-orbs sekai-orbs"></canvas>
<!-- Sparkle Trail -->
<canvas class="canvas-sekai-sparkles sekai-sparkles"></canvas>
<!-- Neon Shapes -->
<canvas class="canvas-sekai-neon-shapes sekai-neon-shapes"></canvas>
<!-- Sakura Corner Decorations -->
<div class="sakura-decor-top" style="--r:15deg">🌸</div>
<div class="sakura-decor-bottom" style="--r:-10deg">🌸</div>

<nav class="app-nav">
    <div class="nav-brand">🌸 Sekai Anime</div>
    <div class="nav-links">
        <a href="/home">首页</a>
        <a href="/anime">🎬 看番</a>
        <a href="/anime-hub">🌐 聚合</a>
        <a href="/dashboard" class="active">数据看板</a>
        <span class="nav-user" th:text="${loginUser.nickName}">Sekai</span>
        <a href="/logout" class="nav-logout">退出</a>
    </div>
</nav>

<main class="app-main">
    <h2 class="reveal">📊 数据看板</h2>

    <div class="dashboard-stats">
        <div class="dash-card reveal"><div class="dash-icon">🔗</div><div class="dash-value" th:text="${stats.siteCount}">0</div><div class="dash-label">收录站点</div></div>
        <div class="dash-card reveal" style="transition-delay:0.05s"><div class="dash-icon">📂</div><div class="dash-value" th:text="${stats.categoryCount}">0</div><div class="dash-label">分类数量</div></div>
        <div class="dash-card reveal" style="transition-delay:0.1s"><div class="dash-icon">⭐</div><div class="dash-value" th:text="${stats.favoriteCount}">0</div><div class="dash-label">收藏站点</div></div>
        <div class="dash-card reveal" style="transition-delay:0.15s"><div class="dash-icon">👆</div><div class="dash-value" th:text="${stats.totalClicks}">0</div><div class="dash-label">总点击量</div></div>
    </div>

    <div class="dashboard-section reveal">
        <h3>🏆 热门站点 TOP 10</h3>
        <div class="top-list" th:if="${not #lists.isEmpty(hotSites)}">
            <div class="top-item" th:each="site,iterStat : ${hotSites}">
                <span class="top-rank" th:classappend="${iterStat.index < 3} ? 'top3'">
                    <span th:if="${iterStat.index == 0}">🥇</span>
                    <span th:if="${iterStat.index == 1}">🥈</span>
                    <span th:if="${iterStat.index == 2}">🥉</span>
                    <span th:if="${iterStat.index > 2}" th:text="${iterStat.index + 1}">4</span>
                </span>
                <span class="top-name" th:text="${site.siteName}">站点名</span>
                <span class="top-url" th:text="${site.siteUrl}">url</span>
                <span class="top-clicks" th:text="${site.clickCount + ' 次'}">0 次</span>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(hotSites)}">
            <p>还没有数据，去首页添加站点吧！</p>
        </div>
    </div>

    <div class="dashboard-section reveal">
        <h3>📂 分类分布</h3>
        <div class="category-bubbles" th:if="${not #lists.isEmpty(categories)}">
            <span class="bubble" th:each="cat : ${categories}" th:text="${cat.name}">分类</span>
        </div>
    </div>
</main>

<script th:src="@{/js/effects.js(v='20260806-sakura3')}" src="/js/effects.js?v=20260806-sakura3"></script>
</body>
</html>
