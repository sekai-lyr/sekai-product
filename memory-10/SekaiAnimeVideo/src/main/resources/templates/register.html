<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071722">
    <title>Sekai Anime | 创建账号</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260830-motion-layer')}" href="/css/app.css?v=20260830-motion-layer">
    <link rel="stylesheet" th:href="@{/css/login.css(v='20260830-motion-layer')}" href="/css/login.css?v=20260830-motion-layer">
</head>
<body class="auth-body">
<!--
THESIS: 注册把第一次收藏变成一套可以持续使用的个人索引。
OWN-WORLD: 深蓝夜景、纸卡式表单和单一信号橙延续全站的索引柜语言。
STORY: 用户先理解保存的价值，再填写必要信息，完成后回到登录继续使用。
FIRST VIEWPORT: 左侧真实夜景建立主题，右侧表单按信息顺序垂直展开，主要动作保持在视线末端。
FORM: 深夜录像租赁店的索引柜，第 6 个自定义方向，seed cae93715。FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<main class="auth-shell">
    <section class="auth-visual" aria-label="Sekai Anime 介绍">
        <div class="auth-visual-copy">
            <a class="brand" href="/" aria-label="返回 Sekai Anime 首页">
                <span class="brand-mark" aria-hidden="true">S</span>
                <span class="brand-copy">
                    <span class="brand-name">Sekai Anime</span>
                    <span class="brand-sub">personal anime index</span>
                </span>
            </a>
            <h1>先把入口收好，再去看<span>下一集。</span></h1>
            <p>创建一个属于自己的动漫站点中转站，把收藏、分类和跳转放在同一个夜间入口里。</p>
            <div class="auth-visual-foot" aria-label="产品能力">
                <span>个人空间</span>
                <span>自由分类</span>
                <span>一键打开</span>
            </div>
        </div>
    </section>

    <section class="auth-content">
        <div class="auth-card">
            <h2>创建账号</h2>
            <p>从你的第一条站点链接开始。</p>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form action="/user/register" method="post" id="registerForm" class="auth-form">
                <label for="userName">用户名</label>
                <input id="userName" name="userName" type="text" placeholder="例如 sekai" autocomplete="username" required>
                <label for="nickName">昵称</label>
                <input id="nickName" name="nickName" type="text" placeholder="你的展示昵称">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password" required>
                <label for="confirmPassword">确认密码</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="再输入一次密码" autocomplete="new-password" required>
                <button class="primary-btn" type="submit">创建账号</button>
            </form>
            <div class="auth-links">
                <a class="secondary-btn" href="/login">返回登录</a>
            </div>
            <a class="back-link" href="/">返回首页</a>
        </div>
    </section>
</main>

<script th:src="@{/js/register.js(v='20260830-motion-layer')}" src="/js/register.js?v=20260830-motion-layer"></script>
<script th:src="@{/js/effects.js(v='20260830-motion-layer')}" src="/js/effects.js?v=20260830-motion-layer"></script>
</body>
</html>
