<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071722">
    <title>Sekai Anime | 我的站点地图</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v='20260830-motion-layer')}" href="/css/app.css?v=20260830-motion-layer">
</head>
<body>
<!--
THESIS: 首页是个人站点索引柜，先显示可用入口，再提供整理动作，拒绝把数据藏在装饰性卡片里。
OWN-WORLD: 深蓝底、浅色文本、信号橙操作色；统计是带刻度的横向信息条，站点是可抽取的索引条。
STORY: 用户进入后先看到自己的规模，再搜索或添加，热门入口作为快捷路径，完整站点列表负责长期整理。
FIRST VIEWPORT: 顶部导航后是标题、两个整理动作和四项统计，搜索工具紧随其后，主要列表在首屏下方开始。
FORM: 深夜录像租赁店的索引柜，第 6 个自定义方向，seed cae93715。FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<header class="site-header app-nav">
    <a class="brand" href="/home" aria-label="Sekai Anime 首页">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy">
            <span class="brand-name">Sekai Anime</span>
            <span class="brand-sub">personal anime index</span>
        </span>
    </a>
    <nav class="site-nav" aria-label="应用导航">
        <a href="/home" class="active">站点地图</a>
        <a href="/anime">看番</a>
        <a href="/anime-hub">聚合</a>
        <a href="/dashboard">数据看板</a>
        <span class="nav-user" th:text="${loginUser.nickName}">Sekai</span>
        <a href="/logout" class="nav-logout">退出</a>
    </nav>
</header>

<main class="app-main">
    <section class="page-intro">
        <div>
            <h1>我的站点地图</h1>
            <p>把常用的看番入口整理成一张随时可以打开的地图。</p>
        </div>
        <div class="page-intro-actions">
            <button class="add-btn" type="button" onclick="openModal('addSiteModal')">添加站点</button>
            <button class="add-btn secondary" type="button" onclick="openModal('addCategoryModal')">添加分类</button>
        </div>
    </section>

    <dl class="stat-rail">
        <div class="stat-item reveal">
            <dt class="stat-label">收录站点</dt>
            <dd class="stat-value" th:text="${stats.siteCount}">0</dd>
        </div>
        <div class="stat-item reveal">
            <dt class="stat-label">分类数量</dt>
            <dd class="stat-value" th:text="${stats.categoryCount}">0</dd>
        </div>
        <div class="stat-item reveal">
            <dt class="stat-label">收藏站点</dt>
            <dd class="stat-value" th:text="${stats.favoriteCount}">0</dd>
        </div>
        <div class="stat-item reveal">
            <dt class="stat-label">总点击量</dt>
            <dd class="stat-value" th:text="${stats.totalClicks}">0</dd>
        </div>
    </dl>

    <div class="flash success" th:if="${message}" th:text="${message}"></div>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>

    <section class="toolbar reveal" aria-label="搜索与筛选">
        <form class="search-form" action="/home" method="get">
            <input type="search" name="keyword" th:value="${keyword}" placeholder="搜索站点名称或标签" class="search-input" aria-label="搜索站点名称或标签">
            <select name="categoryId" class="filter-select" aria-label="筛选分类">
                <option value="">全部分类</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}"
                        th:text="${cat.name}" th:selected="${categoryId != null && categoryId == cat.id}"></option>
            </select>
            <button type="submit" class="search-btn">搜索</button>
        </form>
    </section>

    <section class="hot-section reveal" th:if="${not #lists.isEmpty(hotSites)}" aria-labelledby="hot-title">
        <div class="section-line">
            <h2 id="hot-title">常用入口</h2>
            <p>按点击量排列</p>
        </div>
        <div class="hot-grid">
            <a th:each="site,siteStat : ${hotSites}" th:href="@{/redirect(id=${site.id})}" target="_blank" rel="noopener" class="hot-card">
                <span class="hot-rank" th:text="${siteStat.index + 1}">1</span>
                <span class="hot-name" th:text="${site.siteName}">站点名</span>
                <span class="hot-clicks" th:text="${site.clickCount + ' 次点击'}">0 次点击</span>
            </a>
        </div>
    </section>

    <section aria-labelledby="sites-title">
        <div class="section-line">
            <h2 id="sites-title">全部站点</h2>
            <span class="count-badge" th:text="${totalCount + ' 个入口'}">0 个入口</span>
        </div>
        <div class="site-grid" th:if="${not #lists.isEmpty(sites)}">
            <article class="site-card reveal" th:each="site : ${sites}">
                <div class="card-header">
                    <span class="card-category" th:text="${site.categoryId != null ? '已分类' : '未分类'}">未分类</span>
                    <span class="card-clicks" th:text="${site.clickCount + ' 次点击'}">0 次点击</span>
                </div>
                <h3 class="card-title" th:text="${site.siteName}">站点名</h3>
                <p class="card-desc" th:text="${site.description != null and site.description != '' ? site.description : '还没有添加描述'}">站点描述</p>
                <div class="card-tags" th:if="${site.tags != null and site.tags != ''}">
                    <span class="tag" th:each="tag : ${#strings.arraySplit(site.tags, ',')}" th:text="${tag}">标签</span>
                </div>
                <div class="card-actions">
                    <a th:href="@{/redirect(id=${site.id})}" target="_blank" rel="noopener" class="card-btn primary">打开站点</a>
                    <form action="/favorite/toggle" method="post">
                        <input type="hidden" name="siteId" th:value="${site.id}">
                        <button type="submit" class="card-btn fav">收藏</button>
                    </form>
                    <form action="/site/delete" method="post" onsubmit="return confirm('确定删除这个站点吗？')">
                        <input type="hidden" name="id" th:value="${site.id}">
                        <button type="submit" class="card-btn danger">删除</button>
                    </form>
                </div>
            </article>
        </div>
        <div class="empty-state has-art" th:if="${#lists.isEmpty(sites)}">
            <p>还没有站点。先添加一个你常用的动漫入口。</p>
        </div>
    </section>

    <nav class="pagination" th:if="${totalPages > 1}" aria-label="站点分页">
        <a th:if="${currentPage > 1}" th:href="@{/home(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage - 1})}" class="page-btn">上一页</a>
        <span class="page-info" th:text="${currentPage + ' / ' + totalPages}">1 / 1</span>
        <a th:if="${currentPage < totalPages}" th:href="@{/home(keyword=${keyword}, categoryId=${categoryId}, page=${currentPage + 1})}" class="page-btn">下一页</a>
    </nav>
</main>

<div id="addSiteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="add-site-title" aria-hidden="true">
    <div class="modal-content">
        <h2 id="add-site-title">添加站点</h2>
        <form action="/site/add" method="post">
            <label for="siteName">站点名称</label>
            <input id="siteName" type="text" name="siteName" placeholder="例如：囧次元" required>
            <label for="siteUrl">站点网址</label>
            <input id="siteUrl" type="url" name="siteUrl" placeholder="https://..." required>
            <label for="siteDescription">描述</label>
            <input id="siteDescription" type="text" name="description" placeholder="用一句话说明它适合什么">
            <label for="siteTags">标签</label>
            <input id="siteTags" type="text" name="tags" placeholder="在线观看,番剧,动漫">
            <label for="siteCategory">分类</label>
            <select id="siteCategory" name="categoryId">
                <option value="">不分类</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <div class="modal-actions">
                <button type="submit" class="card-btn primary">保存站点</button>
                <button type="button" class="card-btn" onclick="closeModal('addSiteModal')">取消</button>
            </div>
        </form>
    </div>
</div>

<div id="addCategoryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="add-category-title" aria-hidden="true">
    <div class="modal-content">
        <h2 id="add-category-title">添加分类</h2>
        <form action="/category/add" method="post">
            <label for="categoryName">分类名称</label>
            <input id="categoryName" type="text" name="name" placeholder="例如：在线看番" required>
            <label for="categoryDescription">描述</label>
            <input id="categoryDescription" type="text" name="description" placeholder="这个分类的用途">
            <div class="modal-actions">
                <button type="submit" class="card-btn primary">保存分类</button>
                <button type="button" class="card-btn" onclick="closeModal('addCategoryModal')">取消</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/effects.js(v='20260830-motion-layer')}" src="/js/effects.js?v=20260830-motion-layer"></script>
</body>
</html>
