<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行动计划 - 灵感伙伴签</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=202605271520)}" href="/css/app.css?v=202605271520">
</head>
<body>
<header class="topbar">
    <a class="logo" th:href="@{/home}">灵感伙伴签</a>
    <nav><a th:href="@{/home}">抽签</a><a th:href="@{/wheel}">转盘</a><a th:href="@{/characters}">伙伴库</a><a th:href="@{/history}">历史</a><a th:href="@{/favorites}">收藏</a><a th:href="@{/insights}">分析</a><a class="active" th:href="@{/coach}">行动</a><a th:href="@{/tasks}">任务</a><a th:href="@{/focus}">专注</a><a th:href="@{/membership}">会员</a></nav>
</header>
<main class="dashboard">
    <section class="coach-head">
        <div>
            <p class="eyebrow">VIP Coach</p>
            <h1 th:text="${coachPlan.title}">7 天行动计划</h1>
            <p th:text="${coachPlan.summary}">根据最近抽签生成行动计划。</p>
            <div class="coach-export-actions">
                <a th:href="@{/coach/export.md}">导出 Markdown</a>
                <a th:href="@{/coach/calendar.ics}">加入日历</a>
                <a th:href="@{/tasks}">生成任务</a>
                <a th:href="@{/focus}">进入专注</a>
            </div>
        </div>
        <div class="coach-status">
            <span th:text="${membership.planName}">会员</span>
            <strong th:text="'剩余 ' + ${membership.daysLeft} + ' 天'">剩余 3 天</strong>
            <small th:text="${membership.renewalHint}">续费会自动顺延</small>
        </div>
    </section>

    <section class="stats-grid">
        <div><strong th:text="${coachPlan.averageScore}">0</strong><span>最近均分</span></div>
        <div><strong th:text="${coachPlan.highScore}">0</strong><span>最高分</span></div>
        <div><strong th:text="${coachPlan.lowScore}">0</strong><span>最低分</span></div>
        <div><strong th:text="${coachPlan.totalSamples}">0</strong><span>参考样本</span></div>
    </section>

    <section class="coach-grid">
        <div class="coach-plan-panel">
            <div class="section-title"><h2>本周执行路径</h2><a th:href="@{/home}">继续抽签</a></div>
            <div class="coach-step-list">
                <article class="coach-step" th:each="step : ${coachPlan.steps}">
                    <div class="coach-day" th:text="${step.dayIndex}">1</div>
                    <div>
                        <div class="coach-step-topline">
                            <span th:text="${step.energyLabel}">校准</span>
                            <strong th:text="${step.theme}">今日运势</strong>
                        </div>
                        <h3 th:text="${step.title}">校准目标</h3>
                        <p th:text="${step.action}">行动内容</p>
                        <small th:text="'检查点：' + ${step.checkpoint}">检查点</small>
                    </div>
                </article>
            </div>
        </div>

        <aside class="coach-side">
            <section class="coach-card">
                <div class="section-title"><h2>计划信号</h2></div>
                <div class="coach-signal-list">
                    <p th:each="signal : ${coachPlan.signals}" th:text="${signal}">信号</p>
                </div>
                <div class="report-badges">
                    <span th:text="'节奏：' + ${coachPlan.rhythm}">节奏：稳定推进</span>
                    <span th:text="'风险：' + ${coachPlan.riskLevel}">风险：可控</span>
                    <span th:text="'主题：' + ${coachPlan.primaryTheme}">主题：今日运势</span>
                </div>
            </section>

            <section class="coach-card">
                <div class="section-title"><h2>参考签文</h2><a th:href="@{/history}">历史</a></div>
                <div class="record-list">
                    <article class="record" th:each="record : ${coachPlan.basisRecords}">
                        <img th:src="@{/character/image/{id}(id=${record.character.id},v=202605271520)}" alt="">
                        <div>
                            <strong th:text="${record.character.displayName}">伙伴</strong>
                            <span th:text="${record.wishTopic + ' / ' + record.luckScore}">主题 / 80</span>
                        </div>
                    </article>
                    <p class="muted" th:if="${#lists.isEmpty(coachPlan.basisRecords)}">先去首页抽签，计划会变得更准确。</p>
                </div>
            </section>
        </aside>
    </section>
</main>
</body>
</html>
