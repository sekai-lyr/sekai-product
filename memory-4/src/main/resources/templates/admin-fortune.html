<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('编辑签文')}"></head><body><header th:replace="~{fragments :: header('admin')}"></header><main class="dashboard"><div th:replace="~{fragments :: messages}"></div>
<div class="page-heading"><h1 th:text="${fortune.id == null ? '新增签文' : '编辑签文'}"></h1><a th:href="@{/admin}">返回内容管理</a></div>
<div class="editor-layout"><section class="panel"><form class="form-stack" th:action="@{/admin/fortunes}" th:object="${fortune}" method="post"><input type="hidden" th:field="*{id}"><label>等级名称<input th:field="*{levelName}" maxlength="40" required></label><label>签文标题<input th:field="*{summary}" maxlength="180" required></label><label>行动建议<textarea th:field="*{advice}" maxlength="260" required></textarea></label><div class="form-two"><label>最低分<input th:field="*{scoreMin}" type="number" min="0" max="100" required></label><label>最高分<input th:field="*{scoreMax}" type="number" min="0" max="100" required></label><label>幸运色<input th:field="*{luckyColor}" maxlength="60" required></label><label>幸运物<input th:field="*{luckyItem}" maxlength="80" required></label></div><label class="check-label"><input type="checkbox" th:field="*{enabled}">加入抽签池</label><div class="button-row"><button name="action" value="save">保存签文</button><button class="button secondary" name="action" value="preview">预览未保存内容</button></div></form></section>
<aside class="panel preview-panel"><p class="form-hint" th:text="${preview == true ? '未保存预览' : '当前内容预览'}"></p><span class="tag" th:text="${fortune.levelName}"></span><h2 th:text="${fortune.summary}"></h2><p th:text="${fortune.advice}"></p><p class="form-hint" th:text="${'幸运色：' + fortune.luckyColor + ' · 幸运物：' + fortune.luckyItem}"></p></aside></div>
</main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
