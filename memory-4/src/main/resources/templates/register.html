<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('开启你的相遇手账')}"></head><body><main class="auth-shell"><section class="auth-story"><a class="logo" th:href="@{/login}">灵感伙伴签</a><h1>与一位伙伴相遇，<br>为今天留一点光。</h1><div class="auth-line"></div><p>一张签，一句鼓励，一个小小的行动。把日常的心情和愿望，慢慢收进自己的手账。</p></section><section class="auth-card"><h2>开启你的相遇手账</h2><p>每次相遇，都值得被记住。</p><div th:replace="~{fragments :: messages}"></div><form id="registerForm" th:action="@{/user/register}" method="post"><label for="userName">用户名</label><input id="userName" name="userName" autocomplete="username" pattern="[a-zA-Z0-9_@.\-]{3,64}" maxlength="64" required placeholder="3–64 位字母、数字或 _ @ . -" aria-describedby="userNameError"><span class="error-text" id="userNameError"></span><label>昵称<input name="nickName" maxlength="64" autocomplete="nickname" placeholder="希望伙伴怎样称呼你"></label><label for="password">密码</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required aria-describedby="passwordError"><span class="error-text" id="passwordError"></span><label for="confirmPassword">再输入一次密码</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required aria-describedby="confirmPasswordError"><span class="error-text" id="confirmPasswordError"></span><p class="auth-note">密码至少 8 个字符，不超过 72 字节。注册后请保存你的账号恢复码。</p><button class="button">创建账号</button></form><div class="auth-links"><a th:href="@{/login}">已有账号，去登录</a></div></section></main><script th:src="@{/js/register.js(v=20261028)}"></script></body></html>
