<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感伙伴签 - 注册</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<main class="auth-page register-page">
    <section class="brand-area">
        <p class="eyebrow">New Fortune</p>
        <h1>把好运存档</h1>
        <p class="brand-copy">每一次抽签都会记录下来，慢慢变成属于你的灵感伙伴图鉴。</p>
    </section>
    <section class="form-area">
        <div class="auth-card">
            <div class="card-header">
                <span class="seal">START</span>
                <h2>创建账号</h2>
                <p>准备好抽今天的第一签</p>
            </div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form id="registerForm" th:action="@{/user/register}" action="/user/register" method="post">
                <label>用户名</label>
                <div class="input-box"><span>ID</span><input id="userName" name="userName" required placeholder="6-20 位更好记"></div>
                <div class="error-text" id="userNameError"></div>
                <label>昵称</label>
                <div class="input-box"><span>NM</span><input id="nickName" name="nickName" placeholder="显示在首页的名字"></div>
                <label>密码</label>
                <div class="input-box"><span>PW</span><input id="password" type="password" name="password" required placeholder="至少 6 位"></div>
                <div class="error-text" id="passwordError"></div>
                <label>确认密码</label>
                <div class="input-box"><span>OK</span><input id="confirmPassword" type="password" name="confirmPassword" required placeholder="再输入一次"></div>
                <div class="error-text" id="confirmPasswordError"></div>
                <button class="primary-btn" type="submit">注册</button>
                <a class="secondary-btn" th:href="@{/login}" href="/login">返回登录</a>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/register.js}" src="/js/register.js"></script>
</body>
</html>
