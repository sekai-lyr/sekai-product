<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行动任务 - 灵感伙伴签</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=202605281850)}" href="/css/app.css?v=202605281850">
</head>
<body>
<header class="topbar">
    <a class="logo" th:href="@{/home}">灵感伙伴签</a>
    <nav><a th:href="@{/home}">抽签</a><a th:href="@{/wheel}">转盘</a><a th:href="@{/characters}">伙伴库</a><a th:href="@{/history}">历史</a><a th:href="@{/favorites}">收藏</a><a th:href="@{/insights}">分析</a><a th:href="@{/coach}">行动</a><a class="active" th:href="@{/tasks}">任务</a><a th:href="@{/focus}">专注</a><a th:href="@{/membership}">会员</a></nav>
</header>
<main class="dashboard">
    <section class="task-hero">
        <div>
            <p class="eyebrow">VIP Action Board</p>
            <h1 th:text="${loginUser.nickName} + ' 的行动任务'">行动任务</h1>
            <p>把抽签、转盘和 7 天行动计划沉淀成可完成的任务，再进入专注冲刺真正推进它。</p>
        </div>
        <div class="task-hero-status">
            <span th:text="${membership.planName}">会员</span>
            <strong th:text="${stats.completionPercent + '%'}">0%</strong>
            <small>当前完成率</small>
        </div>
    </section>

    <div class="server-message success" th:if="${message}" th:text="${message}"></div>
    <div class="server-message error" th:if="${error}" th:text="${error}"></div>

    <section class="stats-grid">
        <div><strong th:text="${stats.open}">0</strong><span>进行中</span></div>
        <div><strong th:text="${stats.done}">0</strong><span>已完成</span></div>
        <div><strong th:text="${stats.overdue}">0</strong><span>已逾期</span></div>
        <div><strong th:text="${stats.highPriority}">0</strong><span>高优先级</span></div>
    </section>

    <section class="task-grid">
        <div class="task-board-panel">
            <div class="section-title task-title-row">
                <h2>任务列表</h2>
                <div class="task-tabs">
                    <a th:classappend="${status == 'ALL'} ? ' active' : ''" th:href="@{/tasks}">全部</a>
                    <a th:classappend="${status == 'OPEN'} ? ' active' : ''" th:href="@{/tasks(status='OPEN')}">进行中</a>
                    <a th:classappend="${status == 'DONE'} ? ' active' : ''" th:href="@{/tasks(status='DONE')}">已完成</a>
                </div>
            </div>
            <div class="task-list">
                <article class="task-card" th:each="task : ${tasks}" th:classappend="${task.statusClass}">
                    <div class="task-card-main">
                        <div class="task-card-topline">
                            <span th:text="${task.sourceText}">手动</span>
                            <em th:classappend="${task.statusClass}" th:text="${task.statusText}">进行中</em>
                        </div>
                        <h3 th:text="${task.title}">任务标题</h3>
                        <p th:if="${task.detail != null && task.detail != ''}" th:text="${task.detail}">任务说明</p>
                        <div class="task-meta">
                            <span th:text="'优先级：' + ${task.priorityText}">优先级：普通</span>
                            <span th:text="'日期：' + ${task.dueDateText}">日期：未设</span>
                        </div>
                    </div>
                    <div class="task-actions">
                        <form th:if="${task.open}" th:action="@{/tasks/{id}/complete(id=${task.id})}" method="post">
                            <button type="submit">完成</button>
                        </form>
                        <form th:if="${task.done}" th:action="@{/tasks/{id}/reopen(id=${task.id})}" method="post">
                            <button type="submit">恢复</button>
                        </form>
                        <form th:if="${!task.archived}" th:action="@{/tasks/{id}/archive(id=${task.id})}" method="post">
                            <button class="task-archive-button" type="submit">搁置</button>
                        </form>
                    </div>
                </article>
                <p class="muted" th:if="${#lists.isEmpty(tasks)}">还没有任务。可以手动添加，也可以从 7 天行动计划导入。</p>
            </div>
        </div>

        <aside class="task-side">
            <section class="task-panel">
                <div class="section-title"><h2>新增任务</h2></div>
                <form class="task-form" th:action="@{/tasks}" method="post">
                    <label>
                        <span>任务标题</span>
                        <input name="title" maxlength="100" placeholder="例如：整理今日签文 15 分钟" required>
                    </label>
                    <label>
                        <span>说明</span>
                        <textarea name="detail" maxlength="300" placeholder="写下可交付结果或检查点"></textarea>
                    </label>
                    <div class="task-form-row">
                        <label>
                            <span>优先级</span>
                            <select name="priority">
                                <option value="5">最高</option>
                                <option value="4">较高</option>
                                <option value="3" selected>普通</option>
                                <option value="2">偏低</option>
                                <option value="1">低</option>
                            </select>
                        </label>
                        <label>
                            <span>日期</span>
                            <input name="dueDate" type="date">
                        </label>
                    </div>
                    <button type="submit">加入看板</button>
                </form>
            </section>

            <section class="task-panel task-import-panel">
                <div>
                    <p class="eyebrow">Coach Import</p>
                    <h2>从行动计划生成</h2>
                    <p>把 VIP 7 天行动计划拆成带日期和优先级的任务，重复导入会自动跳过已有项。</p>
                </div>
                <form th:action="@{/tasks/import-coach}" method="post">
                    <button type="submit">导入行动计划</button>
                </form>
                <a class="soft-link" th:href="@{/focus}">开始专注冲刺</a>
                <a class="soft-link" th:href="@{/tasks/export.md}">导出 Markdown</a>
            </section>
        </aside>
    </section>
</main>
</body>
</html>
