<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('愿望档案')}"></head>
<body><header th:replace="~{fragments :: header('wishes')}"></header>
<main class="dashboard"><div th:replace="~{fragments :: messages}"></div>

<div class="page-heading"><div><h1>把愿望，慢慢写成故事。</h1><p>记下此刻在乎的事，再留一段给未来的回顾。</p></div></div>
<section class="panel narrow"><form class="compact-form" th:action="@{/wishes}" method="post"><label>新愿望<input name="title" maxlength="40" required placeholder="例如：完成我的第一个作品"></label><button>记下愿望</button></form><p class="form-hint">抽随机签或三连签时填写同名主题，就会关联到这里。</p></section>
<section class="wish-list narrow"><details th:each="wish : ${wishes}" class="wish-entry" th:classappend="${wish.completed} ? 'complete'"><summary><strong th:text="${wish.title}"></strong><span th:text="${wish.completed ? '已经完成' : '正在途中'}"></span></summary><form class="form-stack" th:action="@{/wishes/{id}(id=${wish.id})}" method="post"><label>留一点回顾<textarea name="review" maxlength="1000" th:text="${wish.review}" placeholder="发生了什么？下次想怎样做？"></textarea></label><label class="check-label"><input type="checkbox" name="completed" value="true" th:checked="${wish.completed}">这个愿望已经完成</label><button>保存回顾</button></form><div class="wish-links"><a th:href="@{/home(wish=${wish.title})}">带着愿望抽签</a><a th:href="@{/history(wishId=${wish.id})}">查看相关相遇</a></div></details><div class="empty-panel" th:if="${#lists.isEmpty(wishes)}"><h2>从一个小愿望开始</h2><p>不必很宏大，今天想完成的一件小事也可以。</p></div></section>

</main><footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
