<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('欢迎回来')}"></head><body><main class="auth-shell"><section class="auth-story"><a class="logo" th:href="@{/login}">灵感伙伴签</a><h1>与一位伙伴相遇，<br>为今天留一点光。</h1><div class="auth-line"></div><p>一张签，一句鼓励，一个小小的行动。把日常的心情和愿望，慢慢收进自己的手账。</p></section><section class="auth-card"><h2>欢迎回来</h2><p>每次相遇，都值得被记住。</p><div th:replace="~{fragments :: messages}"></div><div th:if="${recoveryCode}" class="notice"><strong>请先保存恢复码</strong><code class="recovery-code" th:text="${recoveryCode}"></code><p>只显示这一次；忘记密码时需要使用它。</p></div>
 <form id="loginForm" th:action="@{/user/login}" method="post"><label for="userName">用户名</label><input id="userName" name="userName" autocomplete="username" required maxlength="64" placeholder="用户名或昵称" aria-describedby="userNameError"><span class="error-text" id="userNameError"></span><label for="password">密码</label><div class="input-with-action"><input id="password" type="password" name="password" autocomplete="current-password" required aria-describedby="passwordError"><button id="togglePassword" type="button">显示</button></div><span class="error-text" id="passwordError"></span><button class="button">登录手账</button></form><div class="auth-links"><a th:href="@{/register}">创建账号</a><a th:href="@{/recover}">忘记密码</a></div></section></main><script th:src="@{/js/login.js(v=20261028)}"></script></body></html>
