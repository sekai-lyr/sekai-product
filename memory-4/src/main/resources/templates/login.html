<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感伙伴签 - 登录</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<main class="auth-page login-page">
    <section class="brand-area">
        <p class="eyebrow">Sekai Fortune</p>
        <h1>灵感伙伴签</h1>
        <p class="brand-copy">抽一位原创灵感伙伴，带走一份今天的运势和一点继续前进的心情。</p>
    </section>

    <section class="form-area">
        <div class="auth-card">
            <div class="card-header">
                <span class="seal">LUCK</span>
                <h2>欢迎回来</h2>
                <p>登录后查看你的抽签历史</p>
            </div>
            <div class="server-message success" th:if="${message}" th:text="${message}"></div>
            <div class="server-message error" th:if="${error}" th:text="${error}"></div>
            <form id="loginForm" th:action="@{/user/login}" action="/user/login" method="post">
                <label>用户名</label>
                <div class="input-box">
                    <span>ID</span>
                    <input type="text" id="userName" name="userName" placeholder="输入用户名或昵称" autocomplete="username" required>
                </div>
                <div class="error-text" id="userNameError"></div>

                <label>密码</label>
                <div class="input-box">
                    <span>PW</span>
                    <input type="password" id="password" name="password" placeholder="输入密码" autocomplete="current-password" required>
                    <button class="text-toggle" type="button" id="togglePassword">显示</button>
                </div>
                <div class="error-text" id="passwordError"></div>

                <button class="primary-btn" type="submit">登录</button>
                <a class="secondary-btn" th:href="@{/register}" href="/register">创建账号</a>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/login.js}" src="/js/login.js"></script>
</body>
</html>
