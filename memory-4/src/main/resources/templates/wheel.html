<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('任务转盘')}"></head><body><header th:replace="~{fragments :: header('wheel')}"></header><main class="dashboard"><div th:replace="~{fragments :: messages}"></div>
<div class="page-heading"><div><h1>把下一步，交给一点惊喜。</h1><p>为学习、休息或娱乐各留一只转盘。权重越高，选中的机会越大。</p></div></div>
<section class="deck-toolbar"><form th:action="@{/wheel}" method="get" class="compact-form"><label>当前转盘<select name="deckId"><option th:each="d : ${decks}" th:value="${d.id}" th:text="${d.name}" th:selected="${d.id == deck.id}"></option></select></label><button>切换</button></form>
 <details><summary>新建或重命名转盘</summary><form class="compact-form" th:action="@{/wheel/decks}" method="post"><label>新转盘名称<input name="name" maxlength="40" required placeholder="例如：今晚的休息计划"></label><button>新建</button></form><form class="compact-form" th:action="@{/wheel/decks/{id}(id=${deck.id})}" method="post"><label>当前转盘名称<input name="name" maxlength="40" required th:value="${deck.name}"></label><button>改名</button></form></details>
</section>
<section class="wheel-layout"><div class="wheel-main"><div class="wheel-stage"><canvas id="taskWheel" width="640" height="640" role="img" aria-label="任务转盘，选项可在下方我的分区中查看"></canvas><div class="wheel-pointer" aria-hidden="true"></div><button id="wheelSpinButton" class="wheel-spin-btn" type="button" th:disabled="${#lists.isEmpty(enabledOptions)}">转动命运</button></div><div class="wheel-result" id="wheelResult" role="status" aria-live="polite"><span th:text="${deck.name}"></span><h2 th:text="${#lists.isEmpty(enabledOptions) ? '先放进一件想做的事' : '下一步，会是什么？'}"></h2><p th:text="${#lists.isEmpty(enabledOptions) ? '添加或启用一个分区，就可以开始转动。' : '按下中间的按钮，让指针替你选一个小行动。'}"></p></div></div>
<aside class="wheel-side"><section class="wheel-panel"><h2>添加分区</h2><form class="form-stack" th:action="@{/wheel/options}" method="post"><input name="deckId" type="hidden" th:value="${deck.id}"><label>事情名称<input name="title" maxlength="80" required placeholder="写 15 分钟代码"></label><label>给自己的说明<input name="detail" maxlength="180" placeholder="先完成一个最小的任务"></label><div class="form-two"><label>权重<input name="weight" type="number" min="1" max="10" value="1" required></label><label>分区颜色<select name="color"><option value="#78e08f">草绿</option><option value="#ffe08a">星金</option><option value="#ff8fc7">樱粉</option><option value="#78d5ff">晴蓝</option><option value="#a7a3ff">梦紫</option><option value="#ffb86b">橙光</option></select></label></div><button>加入当前转盘</button></form></section>
<section class="wheel-panel"><h2>从相遇中找灵感</h2><p class="form-hint">根据近期抽签生成小任务，导入时会跳过同名分区。</p><div class="wheel-suggestion-list"><article th:each="s : ${suggestions}"><div><strong th:text="${s.title}"></strong><span th:text="${s.detail}"></span><small th:text="${s.reason}"></small></div><em th:text="'权重 ' + ${s.weight}"></em></article></div><form th:action="@{/wheel/import-suggestions}" method="post"><input name="deckId" type="hidden" th:value="${deck.id}"><button>导入这些小任务</button></form></section>
<section class="wheel-panel"><h2>我的分区</h2><p class="form-hint">展开即可修改。顺序数字越小越靠前；停用后不会参与转盘。</p><details class="option-editor" th:each="o : ${options}"><summary><span class="swatch" th:style="'--swatch:' + ${o.color}"></span><strong th:text="${o.title}"></strong><span class="option-status" th:text="${o.enabled ? '权重 ' + o.weight : '已停用'}"></span></summary><form class="form-stack" th:action="@{/wheel/options/{id}(id=${o.id})}" method="post"><input name="deckId" type="hidden" th:value="${deck.id}"><label>名称<input name="title" th:value="${o.title}" maxlength="80" required></label><label>说明<input name="detail" th:value="${o.detail}" maxlength="180"></label><div class="form-two"><label>权重<input name="weight" type="number" min="1" max="10" th:value="${o.weight}" required></label><label>顺序<input name="sortOrder" type="number" min="0" max="10000" th:value="${o.sortOrder}" required></label></div><label>颜色<input type="color" name="color" th:value="${o.color}"></label><label class="check-label"><input type="checkbox" name="enabled" value="true" th:checked="${o.enabled}">参与转盘</label><button>保存分区</button></form><form class="delete-form" th:action="@{/wheel/options/{id}/delete(id=${o.id})}" method="post" data-confirm="确定删除这个分区？已有转盘记录会保留。"><input name="deckId" type="hidden" th:value="${deck.id}"><button>删除这个分区</button></form></details><p th:if="${#lists.isEmpty(options)}" class="muted">还没有分区，先添加一个小行动。</p></section></aside></section>
<section class="panel"><div class="section-title"><h2>这只转盘的最近记录</h2><a th:href="@{/wheel(deckId=${deck.id})}">刷新</a></div><div class="wheel-history-list"><article th:each="record : ${recentSpins}"><div><strong th:text="${record.resultTitle}"></strong><span th:text="${record.moodLine}"></span></div><em th:text="${record.createTimeText}"></em></article><p th:if="${#lists.isEmpty(recentSpins)}" class="muted">还没有记录。每一次转动都会留在这里。</p></div></section>
</main><footer th:replace="~{fragments :: footer}"></footer><script th:inline="javascript">window.sekaiWheelOptions = /*[[${enabledOptions}]]*/ []; window.sekaiDeckId = /*[[${deck.id}]]*/ null;</script><script th:src="@{/js/wheel.js(v=20261028)}"></script><script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
