<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('伙伴库')}"></head>
<body><header th:replace="~{fragments :: header('characters')}"></header>
<main class="dashboard"><div th:replace="~{fragments :: messages}"></div>

<div class="page-heading"><div><h1>伙伴图鉴</h1><p>从熟悉的名字，到意料之外的相遇。</p></div><a th:href="@{/favorites}">我的收藏</a></div>
<form class="filter-form" th:action="@{/characters}" method="get">
 <label>搜索伙伴<input name="keyword" th:value="${keyword}" maxlength="120" placeholder="名字、系列或标签"></label>
 <label>角色类型<select name="role"><option value="">全部类型</option><option th:each="r : ${roles}" th:value="${r.value}" th:text="${r.label}" th:selected="${role == r.value}"></option></select></label>
 <label>能量标签<select name="energy"><option value="">全部能量</option><option th:each="e : ${energies}" th:value="${e.value}" th:text="${e.label}" th:selected="${energy == e.value}"></option></select></label><button>筛选伙伴</button>
</form>
<section class="character-grid"><a class="character-card" th:each="c : ${characters}" th:href="@{/characters/{id}(id=${c.id})}"><img th:src="@{/character/image/{id}(id=${c.id})}" alt="" loading="lazy" width="300" height="240"><div><h2 th:text="${c.displayName}"></h2><p th:text="${c.displayAnimeTitle}"></p><span th:text="${c.displayArchetype + ' · ' + c.displayElement}"></span></div></a>
<div th:if="${#lists.isEmpty(characters)}" class="empty-panel"><h2>暂时没有匹配的伙伴</h2><p>换一个关键词，或清空筛选重新看看。</p><a class="button secondary" th:href="@{/characters}">清空筛选</a></div></section>
<nav class="pagination" aria-label="伙伴分页"><a th:if="${pagination.previous}" th:href="@{/characters(keyword=${keyword},role=${role},energy=${energy},page=${pagination.page - 1})}">上一页</a><span th:text="${'共 ' + pagination.total + ' 位 · ' + pagination.page + ' / ' + pagination.pages + ' 页'}"></span><a th:if="${pagination.next}" th:href="@{/characters(keyword=${keyword},role=${role},energy=${energy},page=${pagination.page + 1})}">下一页</a></nav>

</main><footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
