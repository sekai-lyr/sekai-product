<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('内容管理')}"></head><body><header th:replace="~{fragments :: header('admin')}"></header><main class="dashboard"><div th:replace="~{fragments :: messages}"></div>
<div class="page-heading"><div><h1>内容管理</h1><p>维护伙伴与签文。停用内容会退出抽签池，历史记录仍然保留。</p></div><div class="button-row"><a class="button" th:href="@{/admin/characters/new}">新增伙伴</a><a class="button secondary" th:href="@{/admin/fortunes/new}">新增签文</a></div></div>
<form class="filter-form" th:action="@{/admin}" method="get"><label>搜索内容<input name="keyword" th:value="${keyword}" placeholder="名称或系列"></label><button>查找</button></form>
<section class="panel"><h2>伙伴库</h2><div class="admin-list"><article class="admin-row" th:each="c : ${pagination.items}"><img th:src="@{/character/image/{id}(id=${c.id})}" alt="" loading="lazy"><div><h3 th:text="${c.displayName}"></h3><p th:text="${c.animeTitle + ' · ' + (c.enabled ? '已启用' : '已停用')}"></p></div><a th:href="@{/admin/characters/{id}(id=${c.id})}">编辑与预览</a></article><p th:if="${#lists.isEmpty(pagination.items)}" class="muted">没有匹配的伙伴。</p></div></section>
<nav class="pagination" aria-label="管理分页"><a th:if="${pagination.previous}" th:href="@{/admin(keyword=${keyword},page=${pagination.page - 1})}">上一页</a><span th:text="${pagination.page + ' / ' + pagination.pages + ' 页'}"></span><a th:if="${pagination.next}" th:href="@{/admin(keyword=${keyword},page=${pagination.page + 1})}">下一页</a></nav>
<section class="panel"><h2>签文库</h2><div class="admin-list"><article class="admin-row" th:each="f : ${fortunes}"><strong th:text="${f.scoreMin + '–' + f.scoreMax}"></strong><div><h3 th:text="${f.levelName}"></h3><p th:text="${f.summary + ' · ' + (f.enabled ? '已启用' : '已停用')}"></p></div><a th:href="@{/admin/fortunes/{id}(id=${f.id})}">编辑与预览</a></article></div></section>
</main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
