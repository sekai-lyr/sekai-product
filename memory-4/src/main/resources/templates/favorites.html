<!DOCTYPE html>
<html lang="zh-CN">
<head th:replace="~{fragments :: head('收藏伙伴')}"></head>
<body>
<header th:replace="~{fragments :: header('characters')}"></header>
<main class="dashboard">
    <section class="list-head">
        <div><p class="eyebrow">我的守护伙伴</p><h1>收藏伙伴</h1></div>
        <a class="soft-link" th:href="@{/characters}">去伙伴库发现更多</a>
    </section>
    <section class="character-grid">
        <a class="character-card" th:each="character : ${characters}" th:href="@{/characters/{id}(id=${character.id})}">
            <img th:src="@{/character/image/{id}(id=${character.id},v=202605091650)}" alt="">
            <div>
                <h2 th:text="${character.displayName}">名字</h2>
                <p th:text="${character.displayAnimeTitle}">作品</p>
                <span th:text="${character.displayArchetype + ' / ' + character.displayElement}">类型</span>
            </div>
        </a>
    </section>
    <p class="muted" th:if="${#lists.isEmpty(characters)}">还没有收藏伙伴。抽签结果或伙伴详情里都可以收藏。</p>
</main><footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js(v=20261028)}"></script>
</body>
</html>
