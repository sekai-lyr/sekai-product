<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('编辑伙伴')}"></head><body><header th:replace="~{fragments :: header('admin')}"></header><main class="dashboard"><div th:replace="~{fragments :: messages}"></div>
<div class="page-heading"><h1 th:text="${character.id == null ? '新增伙伴' : '编辑伙伴'}"></h1><a th:href="@{/admin}">返回内容管理</a></div>
<div class="editor-layout"><section class="panel"><form class="form-stack" th:action="@{/admin/characters}" th:object="${character}" method="post"><input type="hidden" th:field="*{id}"><label>名称<input th:field="*{englishName}" maxlength="120" required></label><label>系列或作品<input th:field="*{animeTitle}" maxlength="180" required></label><div class="form-two"><label>角色类型<input th:field="*{archetype}" maxlength="40" required placeholder="main / guardian / healer"></label><label>能量标签<input th:field="*{element}" maxlength="60" placeholder="Sun / Moon / Dream"></label></div><label>角色标签<textarea th:field="*{quote}" maxlength="240"></textarea></label><label>图片地址<input th:field="*{imageUrl}" type="url" maxlength="500" placeholder="https://..."></label><p class="form-hint">支持 MyAnimeList、Unsplash HTTPS 图片；留空使用默认头像。</p><label>热度<input th:field="*{popularity}" type="number" min="0" max="10000000" required></label><label class="check-label"><input type="checkbox" th:field="*{enabled}">在伙伴库和抽签中启用</label><div class="button-row"><button name="action" value="save">保存伙伴</button><button class="button secondary" name="action" value="preview">预览未保存内容</button></div></form></section>
<aside class="panel preview-panel"><p class="form-hint" th:text="${preview == true ? '未保存预览' : '当前内容预览'}"></p><img th:if="${character.imageUrl != null and !#strings.isEmpty(character.imageUrl)}" th:src="${character.imageUrl}" alt="伙伴图片预览"><h2 th:text="${character.displayName}"></h2><p th:text="${character.animeTitle}"></p><span class="tag" th:text="${character.displayArchetype + ' · ' + character.displayElement}"></span><p th:text="${character.quote}"></p></aside></div>
</main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js(v=20261028)}"></script></body></html>
