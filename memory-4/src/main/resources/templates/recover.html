<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('找回你的手账')}"></head><body><main class="auth-shell"><section class="auth-story"><a class="logo" th:href="@{/login}">灵感伙伴签</a><h1>与一位伙伴相遇，<br>为今天留一点光。</h1><div class="auth-line"></div><p>一张签，一句鼓励，一个小小的行动。把日常的心情和愿望，慢慢收进自己的手账。</p></section><section class="auth-card"><h2>找回你的手账</h2><p>每次相遇，都值得被记住。</p><div th:replace="~{fragments :: messages}"></div><form id="recoveryForm"><label>用户名<input name="userName" autocomplete="username" maxlength="64" required></label><label>预先保存的恢复码<input name="recoveryCode" autocomplete="off" maxlength="100" required></label><p class="auth-note">验证成功后，恢复码会被使用。请在 10 分钟内完成下一步。</p><button class="button">验证恢复码</button></form><form id="resetForm" hidden><input name="token" type="hidden"><label>新密码<input name="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>再输入一次<input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="button">保存新密码</button></form><p id="recoveryStatus" role="status" aria-live="polite" class="form-hint"></p><p class="auth-note">如果没有恢复码，请联系站点管理员核实身份。仍能登录时，可在“账号与恢复码”中生成。</p><div class="auth-links"><a th:href="@{/login}">返回登录</a></div></section></main><script th:src="@{/js/recovery.js(v=20261028)}"></script></body></html>
