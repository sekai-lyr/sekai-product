<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${session.csrfToken}">
    <title th:text="${title + ' · 灵感伙伴签'}">灵感伙伴签</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20261028)}">
    <link rel="stylesheet" th:href="@{/css/journal.css(v=20261028)}">
    <script th:src="@{/js/common.js(v=20261028)}"></script>
</head>
<body>
<header class="topbar" th:fragment="header(active)">
    <a class="logo" th:href="@{/home}" aria-label="灵感伙伴签首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 14.5 9.5 22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/></svg>灵感伙伴签</a>
    <nav aria-label="主导航">
        <a th:href="@{/home}" th:classappend="${active == 'home'} ? 'active'" th:attr="aria-current=${active == 'home' ? 'page' : null}">今日签</a>
        <a th:href="@{/characters}" th:classappend="${active == 'characters'} ? 'active'">伙伴库</a>
        <a th:href="@{/wishes}" th:classappend="${active == 'wishes'} ? 'active'">愿望</a>
        <a th:href="@{/history}" th:classappend="${active == 'history'} ? 'active'">日历</a>
        <a th:href="@{/wheel}" th:classappend="${active == 'wheel'} ? 'active'">转盘</a>
    </nav>
    <details class="account-menu">
        <summary>我的手账</summary>
        <div class="account-links">
            <a th:href="@{/favorites}">收藏伙伴</a><a th:href="@{/account}">账号与恢复码</a>
            <a th:if="${session.loginUser != null and session.loginUser.admin}" th:href="@{/admin}">内容管理</a>
            <form th:action="@{/user/logout}" method="post"><button type="submit">退出登录</button></form>
        </div>
    </details>
</header>
<div th:fragment="messages" class="messages" aria-live="polite">
    <p th:if="${message}" th:text="${message}" class="notice success"></p>
    <p th:if="${error}" th:text="${error}" class="notice error" role="alert"></p>
</div>
<footer th:fragment="footer" class="site-footer"><span>灵感伙伴签</span><p>把一点灵感，带进今天。</p></footer>
</body>
</html>
