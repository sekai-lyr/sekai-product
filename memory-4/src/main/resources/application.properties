spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456520baba}

server.port=${SERVER_PORT:8084}

mybatis.mapper-locations=classpath*:com.sekai.draw.lots.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

sekai.admin-token=${ADMIN_TOKEN:}
sekai.payment.wechat-qr-url=${WECHAT_QR_URL:/img/wechat-qr.jpg}

# Session timeout - 2 hours (in case of inactivity)
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=7200
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M4
