server.port=8085
spring.datasource.url=${SEKAI_DB_URL:jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SEKAI_DB_USER}
spring.datasource.password=${SEKAI_DB_PASSWORD}
mybatis.mapper-locations=classpath*:com.sekai.song.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
server.servlet.session.timeout=120m
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.name=JSESSIONID_M5
