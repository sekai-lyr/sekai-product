server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sekaisong.com;
    ssl_certificate /etc/letsencrypt/live/sekaisong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sekaisong.com/privkey.pem;
    return 301 https://sekaisong.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sekaisong.com;
    ssl_certificate /etc/letsencrypt/live/sekaisong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sekaisong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /api/device-sharing/channel {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
    location ^~ /api/device-sharing/media/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
