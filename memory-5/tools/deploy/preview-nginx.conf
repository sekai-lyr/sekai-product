server {
    listen 127.0.0.1:8081;
    server_name localhost;
    client_max_body_size 1m;
    # Avoid matrix-parameter variants of the restricted application routes.
    if ($uri ~ ";") { return 400; }
    if ($request_method = DELETE) { return 403; }
    location ~ ^/(admin|api/admin|songs/delete|playlists/delete)(/|$) { return 403; }
    location ~ ^/playlists/[0-9]+/songs/remove/ { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 18085;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
