server {
    listen 80;
    listen [::]:80;
    server_name sekaisong.com www.sekaisong.com;
    location /.well-known/acme-challenge/ {
        root /var/www/sekai-acme;
        try_files $uri =404;
    }
    location = /healthz {
        default_type text/plain;
        return 200 'sekai-ready';
    }
    location / { return 301 https://sekaisong.com$request_uri; }
}
