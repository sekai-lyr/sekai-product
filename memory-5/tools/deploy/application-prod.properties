server.address=127.0.0.1
server.port=8085
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${SEKAI_DB_USER}
spring.datasource.password=${SEKAI_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
server.tomcat.max-http-form-post-size=210MB
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=5
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie
