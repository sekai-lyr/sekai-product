<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑封面 - Sekai Song</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/site-theme.js?v=20261028"></script>
    <link rel="stylesheet" href="/css/site-theme.css?v=20261025">
    <link rel="stylesheet" href="/css/library-experience.css?v=20261028">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments :: sidebar('songs')}"></div>
    <main class="content" id="song-cover-editor" th:attr="data-user-id=${loginUser.id},data-song-id=${song.id}">
        <h1>编辑封面</h1>
        <h2 th:text="${song.title}">歌曲名称</h2>
        <p>选择本机 PNG、JPG 或 WebP，不需要与音视频同名，也不需要先关联音视频。</p>
        <img id="cover-preview" th:attr="data-song-cover-id=${song.id}" th:src="${#strings.isEmpty(song.coverUrl) or not (#strings.startsWith(song.coverUrl,'/') or #strings.startsWith(song.coverUrl,'http')) ? '/images/login-music-room.png' : song.coverUrl}" alt="封面预览" style="width:240px;height:240px;object-fit:cover">
        <p><label>选择封面 <input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp"></label></p>
        <button id="cover-save" type="button" disabled>保存本机封面</button>
        <p id="cover-status" role="status">封面保存在当前设备的此浏览器，不上传服务器。清理网站数据后需要重新选择。</p>
        <p><a th:href="@{/player/{id}(id=${song.id})}">关联音视频 / 播放</a> · <a href="/songs">返回歌曲库</a></p>
    </main>
</div>
<script src="/js/song-cover-editor.js?v=20261026"></script>
</body>
</html>
