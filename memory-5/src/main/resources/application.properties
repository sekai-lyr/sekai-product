# 数据库凭据通过环境变量 / JVM 参数注入，仓库中不保留任何真实口令：
#   DB_URL / DB_USERNAME / DB_PASSWORD
# 本地启动见 README「启动」一节；服务器由 systemd EnvironmentFile 或启动脚本提供。
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sekai_friend?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=${SERVER_PORT:8085}

spring.servlet.multipart.max-file-size=4096MB
spring.servlet.multipart.max-request-size=4200MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=4200MB

mybatis.mapper-locations=classpath*:com.sekai.song.mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Session timeout - 2 hours (in case of inactivity). The player refreshes this while open.
server.servlet.session.timeout=120m
# Keep the browser cookie long enough for the player heartbeat to renew an active session.
server.servlet.session.cookie.max-age=30d
# Unique cookie name to avoid conflicts between projects
server.servlet.session.cookie.name=JSESSIONID_M5
