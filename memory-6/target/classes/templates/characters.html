<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色库 - Sekai Draw Lots</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="logo" th:href="@{/home}" href="/home"><span>DL</span><strong>Sekai Draw Lots</strong></a>
        <nav>
            <a th:href="@{/home}" href="/home">今日抽签</a>
            <a class="active" th:href="@{/characters}" href="/characters">角色库</a>
            <a th:href="@{/history}" href="/history">抽签历史</a>
        </nav>
    </aside>
    <main class="content">
        <header class="topbar">
            <div>
                <p class="eyebrow">Character Pool</p>
                <h1>角色英文名池</h1>
            </div>
            <form class="search-form" th:action="@{/characters}" action="/characters" method="get">
                <input type="search" name="keyword" th:value="${keyword}" placeholder="搜索角色、作品、标签">
                <button class="primary-btn" type="submit">搜索</button>
            </form>
        </header>

        <section class="character-grid">
            <article class="character-card" th:each="character : ${characters}">
                <div class="avatar-circle" th:text="${#strings.substring(character.englishName,0,1)}">M</div>
                <h2 th:text="${character.englishName}">Character</h2>
                <p th:text="${character.animeTitle}">Anime</p>
                <div class="tag-row">
                    <span th:text="${character.roleType}">main</span>
                    <span th:text="${character.energy}">bright</span>
                </div>
            </article>
        </section>
    </main>
</div>
</body>
</html>
