<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品发布</title>
    <link rel="stylesheet" th:href="@{/product.css}">
</head>
<body>

<div class="pub-box">
    <h2>商品发布</h2>
    <form id="pubForm">

        <div class="item">
            <label>商品名称</label>
            <input type="text" id="name" placeholder="请输入商品名称" required>
        </div>

        <div class="item">
            <label>商品描述</label>
            <textarea id="description" rows="3" placeholder="请输入商品描述" required></textarea>
        </div>

        <div class="item">
            <label>商品价格</label>
            <input type="number" step="0.01" id="price" placeholder="例如：7999.00" required>
        </div>

        <div class="item">
            <label>库存数量</label>
            <input type="number" id="stock" placeholder="例如：50" required>
        </div>

        <div class="item">
            <label>分类ID（逗号分隔）</label>
            <input type="text" id="categoryIds" placeholder="例如：1,7,13" required>
        </div>

        <div class="item">
            <label>商品图片（URL）</label>
            <input type="text" id="images" placeholder="多个用英文逗号分隔">
        </div>

        <div class="item">
            <label>详情图片（URL）</label>
            <input type="text" id="detail" placeholder="多个用英文逗号分隔">
        </div>

        <button type="submit" class="pub-btn">立即发布商品</button>
        <button type="button" class="pub-btn" onclick="location.href='/product/list'">查看商品列表</button>
    </form>
</div>

<script th:src="@{/product.js}"></script>
</body>
</html>
